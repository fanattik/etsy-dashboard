<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etsy Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23f1641e'/><path d='M10 22v-5M16 22V11M22 22v-8' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efefef; --panel: #ffffff; --panel-2: #f5f5f5; --side: #ffffff; --text: #171717; --muted: #737373; --faint: #a3a3a3;
  --line: #ececec; --accent: #171717; --accent-fg: #ffffff; --brand: #45a86b; --brand-soft: #e7f5ec;
  --good: #2f9e5b; --good-soft: #e3f4e8; --bad: #d64545; --bad-soft: #fbe7e7; --warn: #c77c12; --warn-soft: #fbf0dc;
  --shop-1: #6b7cf6; --shop-2: #e2a33b; --shop-3: #2bb3a6; --shop-4: #b36bdc;
  --shadow: none; --radius: 14px; --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #0e0e0e; --panel: #1b1b1b; --panel-2: #242424; --side: #1b1b1b; --text: #f2f2f2; --muted: #9a9a9a; --faint: #666;
  --line: #2a2a2a; --accent: #f2f2f2; --accent-fg: #111; --brand: #5cc185; --brand-soft: #173222;
  --good: #5cc185; --good-soft: #173222; --bad: #ef6b6b; --bad-soft: #3a1b1b; --warn: #e5a13a; --warn-soft: #36270f; --shop-1: #8b98fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --panel: #1b1b1b; --panel-2: #242424; --side: #1b1b1b; --text: #f2f2f2; --muted: #9a9a9a; --faint: #666;
    --line: #2a2a2a; --accent: #f2f2f2; --accent-fg: #111; --brand: #5cc185; --brand-soft: #173222;
    --good: #5cc185; --good-soft: #173222; --bad: #ef6b6b; --bad-soft: #3a1b1b; --warn: #e5a13a; --warn-soft: #36270f; --shop-1: #8b98fa;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono, .kpi .value, .big, .num { font-family: var(--mono); font-feature-settings: "zero" 0; }

/* rozvržení: boční menu jako karta + obsah */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; gap: 10px; padding: 10px; }
.side { background: var(--side); border-radius: var(--radius); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 10px; height: calc(100vh - 20px); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14.5px; padding: 4px 8px 20px; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--text); display: grid; place-items: center; }
.brand .logo svg { stroke: var(--text); stroke-width: 2.6; width: 14px; height: 14px; }
.nav-label { display: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 13.5px; }
.nav a svg.i { color: var(--muted); }
.nav a:hover { background: var(--panel-2); }
.nav a.on { background: var(--panel-2); font-weight: 500; }
.nav a.on svg.i { color: var(--text); }
.side .grow { flex: 1; }
.side-card { border-top: 1px solid var(--line); padding: 14px 8px 4px; font-size: 12.5px; color: var(--muted); }
.side-card b { color: var(--text); display: block; margin-bottom: 3px; font-size: 13px; font-weight: 500; }
.side-card .btn { width: 100%; margin-top: 10px; justify-content: center; }
.side .ver { font-size: 11.5px; color: var(--faint); padding: 10px 8px 0; font-family: var(--mono); }
main { min-width: 0; padding: 22px 22px 50px; background: var(--bg); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 22px; }
.top h1 { font-size: 28px; margin: 0; letter-spacing: -.03em; line-height: 1.15; font-weight: 500; }
.top .status { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.status .err { color: var(--bad); }
.spacer { flex: 1; }
.demo { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 500; vertical-align: middle; margin-left: 8px; letter-spacing: .04em; }

/* ovládací prvky */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { opacity: .88; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
select, input, textarea { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 9px; font-size: 13.5px; }
.filters select { font-size: 13px; font-weight: 500; padding: 7px 10px; }
select { cursor: pointer; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--text) 18%, transparent); outline-offset: 0; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.seg button.on { background: var(--panel-2); color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* karty */
.grid { display: grid; gap: 10px; }
.card { background: var(--panel); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { font-size: 14px; margin: 0; font-weight: 400; color: var(--muted); }
.card-h .note { color: var(--text); font-size: 12.5px; display: block; margin-top: 10px; }
.kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 10px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.kpi .value { font-size: 23px; font-weight: 400; letter-spacing: -.02em; line-height: 1.25; margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kpi .value small { font-size: 14px; }
.kpi .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
.kpi.warn .value { color: var(--warn); }
.arrow { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-family: Inter, sans-serif; flex: none; }
.arrow.up { background: var(--good-soft); color: var(--good); } .arrow.down { background: var(--bad-soft); color: var(--bad); }
.trend { display: inline-flex; align-items: center; font-weight: 500; font-size: 11.5px; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); }
.trend.up { color: var(--good); background: var(--good-soft); } .trend.down { color: var(--bad); background: var(--bad-soft); }
.kpi .head .trend { margin-left: auto; }
.row2 { grid-template-columns: 1.6fr 1fr; margin-bottom: 10px; }
.halves { grid-template-columns: 1fr 1fr; margin-bottom: 10px; }
.big { font-size: 30px; font-weight: 400; letter-spacing: -.03em; line-height: 1.1; }
.headline { margin-left: auto; text-align: right; }
.headline .lbl { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-bottom: 4px; }
.headline .val { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg text { fill: var(--faint); font-size: 11px; font-family: Inter, sans-serif; }
.tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.08); padding: 7px 10px; border-radius: 8px; font-size: 12px; display: none; z-index: 20; white-space: nowrap; }
.tip .t { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 8px 0; font-size: 13px; }
.list li + li { border-top: 1px solid var(--line); }
.list .meter { grid-column: 1 / -1; height: 4px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.list .meter i { display: block; height: 100%; border-radius: 99px; }
.list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.banner { background: var(--panel); border-radius: var(--radius); padding: 14px 20px; margin-bottom: 10px; display: none; border-left: 3px solid var(--brand); }
.banner ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.banner .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; }
.banner b { font-weight: 500; }

/* tabulky */
.tablewrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 6px 10px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.nw { white-space: nowrap; }
td.items { max-width: 380px; }
tr.new td { background: var(--brand-soft); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ship { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--good-soft); color: var(--good); }
.search { min-width: 200px; flex: 1 1 240px; max-width: 420px; background: var(--panel-2); border-color: transparent; }
.more { text-align: center; margin-top: 14px; }
.tfilters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: -4px 0 14px; }
.tfilters label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.tfilters input, .tfilters select, .tfilters .btn { height: 34px; box-sizing: border-box; }
.tfilters input, .tfilters select { background: var(--panel-2); border-color: transparent; font-size: 13px; padding: 0 10px; color: var(--text); }
.tfilters select { max-width: 240px; }
.tsum { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.tsum b { color: var(--text); font-weight: 500; font-family: var(--mono); }
th.sortable { cursor: pointer; user-select: none; }
.lcell { display: flex; align-items: center; gap: 12px; min-width: 240px; }
.thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; background: var(--panel-2); display: grid; place-items: center; color: var(--muted); font-weight: 500; font-size: 14px; }
.lcell .t { font-weight: 500; }
.lcell a.t { color: var(--text); text-decoration: none; } .lcell a.t:hover { text-decoration: underline; }
.lcell .tags { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tfilters .grow { flex: 1; }
.addship, .carrier { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; font-size: 12px; } .addship { color: var(--faint); } .carrier { color: var(--muted); } tr.click:hover .addship { color: var(--text); }
#odetail { width: min(620px, calc(100vw - 32px)); }
#odetail h4.dsec { margin: 22px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.shipform { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.shipform .field:last-child { grid-column: 1 / -1; }
.pricerow { display: flex; gap: 8px; } .field .pricerow input { flex: 1; min-width: 0; width: auto; } .field .pricerow select { width: 110px; flex: none; }
.osum { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; margin-top: 14px; }
.osum span { color: var(--muted); } .osum b { text-align: left; }
@media (max-width: 600px) { .shipform { grid-template-columns: 1fr; } }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
#ldetail { width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
#ldetail .dlg { max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box; position: relative; }
.dclose { position: absolute; top: 14px; right: 14px; }
.dhead { display: flex; gap: 18px; align-items: flex-start; padding-right: 40px; }
.dimg { width: 150px; height: 150px; border-radius: 12px; object-fit: cover; flex: none; background: var(--panel-2); }
span.dimg { font-size: 42px; }
.dtitle { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.dtitle h3 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 500; }
.dmeta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.dstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
.dstat { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dstat span { color: var(--muted); font-size: 12px; } .dstat b { text-align: left; font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
#ldetail h4 { margin: 22px 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
#ldetail h4 small { font-family: var(--mono); color: var(--faint); margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; }
.ddesc { white-space: pre-wrap; font-size: 13px; line-height: 1.55; max-height: 220px; overflow-y: auto; background: var(--panel-2); border-radius: 10px; padding: 12px 14px; }
@media (max-width: 600px) { .dhead { flex-direction: column; } .dimg { width: 100%; height: 200px; } .dstats { grid-template-columns: 1fr 1fr; } }
th.sortable:hover, th.sorted { color: var(--text); }

/* nový listing */
.nl-setup { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 14px; }
.nl-setup .field { margin-top: 0; }
.nl-warn { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 14px; }
.nl-warn a { color: inherit; font-weight: 500; }
.nl-item { padding: 0; margin-top: 10px; }
.nl-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; }
.nl-head .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-head .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-head .grow { flex: 1; min-width: 0; }
.nl-head input[type=checkbox] { width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
.nl-head .chev { color: var(--muted); transition: transform .15s; }
.nl-item.open .chev { transform: rotate(180deg); }
.nl-body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0 22px; padding: 0 20px 20px; border-top: 1px solid var(--line); }
.nl-body .full { grid-column: 1 / -1; }
.nl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.nl-count { float: right; font-family: var(--mono); color: var(--faint); }
.nl-count.bad, .nl-bad, .hint.nl-bad { color: var(--bad); }
.nl-imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.nl-img { position: relative; width: 84px; height: 84px; border-radius: 9px; overflow: hidden; background: var(--panel-2); }
.nl-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nl-img.off img { opacity: .3; }
.nl-img b { position: absolute; left: 5px; top: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 10.5px; border-radius: 5px; padding: 0 5px; font-weight: 500; }
.nl-img button, .nl-files button.x { border: 0; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; line-height: 1; }
.nl-img button { position: absolute; right: 4px; top: 4px; }
.nl-img button.l { right: auto; left: 4px; top: auto; bottom: 4px; }
.nl-add { width: 84px; height: 84px; border-radius: 9px; border: 1.5px dashed var(--faint); display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 22px; }
.nl-add:hover { color: var(--text); border-color: var(--text); }
.nl-files { list-style: none; margin: 0; padding: 0; }
.nl-files li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
.nl-files li + li { border-top: 1px solid var(--line); }
.nl-files li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-files li.off span { color: var(--faint); text-decoration: line-through; }
.nl-files button.x { background: var(--panel-2); color: var(--muted); }
.nl-files input[type=checkbox] { width: auto; flex: none; accent-color: var(--accent); }
.nl-imgs .nl-add { display: grid; margin: 0; font-size: 22px; color: var(--muted); }
.nl-bar { position: sticky; bottom: 10px; margin-top: 10px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.nl-bar .field { margin: 0; flex: 1 1 320px; }
.nl-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
.lbulk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel-2); border-radius: 10px; padding: 8px 10px 8px 14px; margin: 0 0 12px; font-size: 13px; }
.lbulk b { font-weight: 500; }
td.sel, th.sel { width: 28px; padding-right: 0; vertical-align: middle; } td.sel input, th.sel input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.ld-actions { margin-top: 2px; }
#sale .field input { width: 100%; }
.nl-body .seg button { padding: 6px 12px; }
.nl-det { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.nl-det summary { cursor: pointer; font-size: 14px; }
.nl-det summary b { font-weight: 500; }
.nl-det summary .hint { margin-left: 6px; }
.nl-attrs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px; }
.nl-attrs .full { grid-column: 1 / -1; }
.msel { position: relative; max-width: 420px; }
.msel-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; color: var(--text); cursor: pointer; font: inherit; }
.msel-pop { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 8px; }
.msel-pop > input { width: 100%; margin-bottom: 6px; }
.msel-list { max-height: 260px; overflow: auto; display: grid; }
.msel-list label.check { display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px 8px; font-size: 13.5px; color: var(--text); text-transform: none; letter-spacing: 0; border-radius: 8px; cursor: pointer; } .msel-list label.check:hover { background: var(--panel-2); }
.field .msel-list label.check { justify-content: flex-start; } .field .msel-list input[type=checkbox] { width: 16px; height: 16px; flex: 0 0 16px; margin: 0; padding: 0; accent-color: var(--accent); }
.msel-sel { margin-top: 8px; } .msel-sel:empty { display: none; }
button.chip { border: 1px solid transparent; cursor: pointer; color: var(--text); }
button.chip:hover { border-color: var(--line); }
button.chip.on { background: var(--accent); color: var(--accent-fg); }
.nl-var { background: var(--panel-2); border-radius: 12px; padding: 4px 14px 14px; margin-top: 12px; }
.nl-var .field input, .nl-var .field select { background: var(--panel); }
.nl-var button.chip { background: var(--panel); } .nl-var button.chip.on { background: var(--accent); }
.nl-varrow { display: flex; gap: 12px; align-items: flex-end; } .nl-varrow .field { flex: 1; min-width: 0; } .nl-varrow .btn { margin-bottom: 1px; }
.nl-flags { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; }
.nl-sec { margin: 18px 0 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.nl-combos td { padding: 6px 10px; vertical-align: middle; } .nl-combos input:not([type=checkbox]) { width: 110px; padding: 5px 8px; background: var(--panel-2); border-color: transparent; }
.nl-combos input.num { text-align: right; } .nl-combos input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
@media (max-width: 900px) { .nl-setup { grid-template-columns: 1fr 1fr; } .nl-body { grid-template-columns: minmax(0, 1fr); } .nl-attrs { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) {

  .nl-head .t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .nl-head .chev { display: none; } .nl-head .pill { margin-left: 30px; } .nl-head .btn.ghost { margin-left: auto; }
  .nl-bar { position: static; }
}
.empty { color: var(--muted); padding: 28px 0; text-align: center; font-size: 13px; }
.linkbtn { background: none; border: 0; color: var(--text); cursor: pointer; font-weight: 500; padding: 0; text-decoration: none; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }

/* nastavení */
.settings { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.settings .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 500; }
.field { margin-top: 14px; }
.field label, .flabel { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: var(--panel-2); border-color: transparent; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; align-items: center; }
.actions.left { justify-content: flex-start; }
.shoprow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel-2); border-radius: 10px; margin-top: 8px; font-size: 13.5px; }
.shoprow b { font-weight: 500; }
.msg { font-size: 13px; margin-top: 8px; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
.danger-zone h2 { color: var(--bad); }
.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13.5px; }

/* import a uvítání */
dialog { border: 0; border-radius: 18px; background: var(--panel); color: var(--text); width: min(580px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 22px 24px; }
.dlg h3 { margin: 0 0 4px; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
.drop { border: 1.5px dashed var(--faint); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); background: var(--panel-2); font-size: 13.5px; }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .link { display: inline; color: var(--text); cursor: pointer; text-decoration: underline; margin: 0; font-size: inherit; font-weight: 500; }
#impResults li { grid-template-columns: 1fr auto; }
.welcome { max-width: 680px; }
.welcome h2 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.02em; font-weight: 500; }
.welcome ol { padding-left: 20px; } .welcome li { margin: 6px 0; }
.welcome a { text-decoration: underline; }
.page[hidden] { display: none; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .row2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; padding: 0; gap: 0; }
  .side { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; padding: 8px 12px; border-radius: 0; border-bottom: 1px solid var(--line); overflow-x: auto; gap: 4px; }
  .brand { padding: 0 6px 0 0; } .brand span { display: none; }
  .nav { flex-direction: row; gap: 4px; } .nav a { padding: 7px 10px; white-space: nowrap; }
  .side .grow, .side-card, .side .ver { display: none; }
  main { padding: 18px 12px 50px; }
  .halves, .settings { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr; gap: 8px; } .kpi .value { font-size: 18px; } .card { padding: 14px 14px; } .tablewrap { margin: 0 -14px; padding: 0 14px; } .search { min-width: 0; flex: 1; } .tfilters label { flex: 1 1 40%; } .tfilters select { max-width: none; } .nav a span { display: none; } .top h1 { font-size: 24px; } }
</style>

function listingSales(f, listings) {  // prodané kusy a tržby za období podle názvu položky v objednávkách
  const by = {}, m = new Map();
  listings.forEach(l => { (by[l.shop] = by[l.shop] || []).push(l); m.set(l, { q: 0, rev: {}, orders: [] }); });
  const find = (shop, name) => {
    const ls = by[shop] || [], cut = name.replace(/…$/, "");
    return ls.find(l => l.nazev === name) || (cut.length > 8 && ls.find(l => l.nazev.startsWith(cut)));
  };
  f.pOrders.forEach(r => {
    const items = (r.polozky || "").split("; ").map(it => { const mt = it.match(/^(\d+)x (.*)$/); return mt ? [+mt[1], mt[2]] : [1, it]; })
      .filter(([, n]) => n && !/^\d+ ks$/.test(n));
    const total = items.reduce((a, [q]) => a + q, 0);
    items.forEach(([q, n]) => {
      const l = find(r.shop, n); if (!l) return;
      const s = m.get(l); s.q += q; s.rev[r.mena] = (s.rev[r.mena] || 0) + r.celkem * q / total; s.orders.push([r, q]);
    });
  });
  return m;
}

  return `<span class="pill ${st === "active" ? "done" : st === "sold_out" ? "ship" : ""}">${esc(tMap("lstates", st) || st)}</span>`;
}

let notified = LS.get("notified", 0);
async function load() {
  try {
    S = await api("/api/stav");
    RAW = await api("/api/data");
    if (!RATES || Date.now() / 1000 - (RATES.stazeno || 0) > 12 * 3600) RATES = await api("/api/kurzy").catch(() => RATES);
    convertData();
    const prev = $("#period").value; buildPeriods(); if (prev) $("#period").value = prev;
    render();
    notifyNew();
    syncServerLang();
  } catch (e) { $("#status").innerHTML = `<span class="err">${esc(t("notRunning"))} ${esc(e.message)}</span>`; }
}
function notifyNew() {
  const newest = Math.max(0, ...D.objednavky.map(r => r.pridano_ts), ...D.vypis.map(r => r.pridano_ts));
  if (!notified) { notified = newest; LS.set("notified", newest); return; }
  if (newest <= notified) return;
  const nO = D.objednavky.filter(r => r.pridano_ts > notified);
  notified = newest; LS.set("notified", newest);
  if (!nO.length || !("Notification" in window) || Notification.permission !== "granted") return;
  new Notification(nO.length === 1 ? t("newOrder") : t("newOrders", { n: nO.length }),
    { body: nO.slice(0, 3).map(r => `${r.shop}: ${fmtMoney(r.celkem, r.mena)} (${r.polozky})`).join("\n") });
}
function renderNotif() {
  const ok = "Notification" in window, p = ok ? Notification.permission : "denied";
  $("#notifBtn").hidden = p !== "default";
  $("#notifState").textContent = p === "granted" ? t("notifOn") : p === "denied" && ok ? t("notifBlocked") : "";
}
$("#notifBtn").onclick = async () => { await Notification.requestPermission(); renderNotif(); };

  CH.series.forEach((ser, si) => { const c = $("#hc" + si); c.setAttribute("cx", hx); c.setAttribute("cy", CH.y(ser[i])); });
  const [yy, m] = CH.ms[i];

async function importFiles(files) {

}

// etsy-listing.md: sekce „## Title“, „## Tags“, „## Price“, „## Description“
function parseListingMd(text) {
  const sec = {}; let cur = null;
  text.replace(/\r/g, "").split("\n").forEach(line => {
    const m = line.match(/^##\s+(.*)$/);
    if (m) { cur = m[1].toLowerCase(); sec[cur] = []; } else if (cur) sec[cur].push(line);
  });
  const get = k => { const key = Object.keys(sec).find(x => x.startsWith(k)); return key ? sec[key].join("\n").trim() : ""; };
  const price = (get("price").match(/\d+(?:[.,]\d+)?/) || [""])[0].replace(",", ".");
  return { nazev: get("title").split("\n")[0].trim(), stitky: get("tags").split(/[,\n]/).map(x => x.trim()).filter(Boolean).join(", "),
    cena: price, popis: get("description") };
}
const imgRank = n => /etsy-cover|cover-etsy|main/i.test(n) ? 0 : /preview|mockup/i.test(n) ? 1 : 2;
function nlProduct(p, imgs, files) {
  const o = { id: ++NLID, on: true, open: false, typ: LS.get("nlType_" + $("#nlShop").value, "digital"), nazev: "", cena: "", mnozstvi: "",
    kategorie: "", odhad: false, stitky: "", popis: "", doprava: "", zpracovani: "", attrs: {}, vars: [], dle: { cena: [], mnozstvi: [], sku: [] },
    kc: {}, kq: {}, ks: {}, koff: {}, perso: [], obrazky: [], soubory: [], stav: "", vysledek: null, ...p };
  o.obrazky = (imgs || []).sort((a, b) => imgRank(a.name) - imgRank(b.name) || a.name.localeCompare(b.name)).map(f => ({ file: f, url: URL.createObjectURL(f), on: true }));
  // soubory: když popis mluví o ZIPu, nahrají se ZIPy, jinak PDF; ostatní zůstanou vypnuté
  const zip = /\bzip\b/i.test(o.popis);
  o.soubory = (files || []).sort((a, b) => a.name.localeCompare(b.name)).map(f => ({ file: f, on: zip ? /\.zip$/i.test(f.name) : !/\.zip$/i.test(f.name) }));
  if (o.soubory.length && !o.soubory.some(f => f.on)) o.soubory.forEach(f => f.on = true);
  if (files) o.typ = files.length ? "digital" : "physical";  // ze složky: se soubory ke stažení = digitální
  if (!o.kategorie) { o.kategorie = guessCat(o); o.odhad = !!o.kategorie; }
  return o;
}
async function loadFolder(fileList) {
  const files = [...fileList], dirs = {};
  const dirOf = f => (f.webkitRelativePath || f.name).split("/").slice(0, -1).join("/");
  files.forEach(f => (dirs[dirOf(f)] = dirs[dirOf(f)] || []).push(f));
  const added = [];
  for (const [dir, list] of Object.entries(dirs).sort()) {
    const md = list.find(f => /^(etsy-)?listing\.md$/i.test(f.name)); if (!md) continue;
    const p = parseListingMd(await md.text());
    added.push(nlProduct(p, list.filter(f => IMG_RE.test(f.name)), list.filter(f => /\.(zip|pdf)$/i.test(f.name))));

  $("#nlLoadMsg").textContent = added.length ? t("nlLoaded", { n: pl(added.length, "listing") }) : t("nlNoMd");

const stem = w => w.toLowerCase().replace(/(ies)$/, "y").replace(/(es|s)$/, "");
function guessCat(p) {
  const tax = nlOpts().kategorie; if (!tax?.length) return "";
  const words = new Set(`${p.nazev} ${p.stitky}`.split(/[^A-Za-z]+/).filter(w => w.length > 3).map(stem));
  let best = null;
  for (const [, path] of tax) {
    const segs = path.split(" › "), leaf = segs[segs.length - 1].split(/[^A-Za-z]+/).filter(w => w.length > 3).map(stem);
    const rest = segs.slice(0, -1).join(" ").split(/[^A-Za-z]+/).filter(w => w.length > 3).map(stem);
    const hit = leaf.filter(w => words.has(w)).length; if (!hit) continue;
    const score = hit * 2 + rest.filter(w => words.has(w)).length - (leaf.length - hit) * .5 - segs.length * .01;
    if (!best || score > best[0]) best = [score, path];
  }
  return best ? best[1] : "";
}

    .map(([pid, a]) => ({ property_id: +pid, nazev: propOf(p, pid)?.nazev, value_ids: a.ids, values: a.vals, scale_id: a.scale || null }));
  let varianty = null;
  if (p.vars.length) {
    const vlastnosti = p.vars.map(v => ({ property_id: v.pid === "custom" ? "custom" : v.pid, nazev: v.pid === "custom" ? v.nazev : propOf(p, v.pid)?.nazev || v.nazev,
      scale_id: v.pid === "custom" ? null : v.scale || null, hodnoty: varValues(v) }));
    const names = vlastnosti.map(v => v.hodnoty.map(h => h.nazev));
    varianty = { vlastnosti, cena_dle: p.dle.cena, mnozstvi_dle: p.dle.mnozstvi, sku_dle: p.dle.sku,
      kombinace: combos(p).map(c => ({ hodnoty: c.map((h, i) => names[i].indexOf(h.nazev)), cena: p.dle.cena.length ? p.kc[subKey(p, "cena", c)] : null,
        mnozstvi: p.dle.mnozstvi.length ? p.kq[subKey(p, "mnozstvi", c)] : null, sku: p.dle.sku.length ? p.ks[subKey(p, "sku", c)] : "",
        aktivni: !p.koff[c.map(h => h.nazev).join(SEP)] })) };
  }
  const personalizace = p.edit || p.perso.length ? p.perso.filter(q => q.text.trim()) : undefined;
  return { atributy: attrs, varianty, personalizace };
}

function detailToProduct(d) {
  const o = nlOpts(), prods = d.produkty || [];
  const p = nlProduct({ open: true, edit: true, listing_id: d.listing_id, stavEtsy: d.stav, typ: d.typ, nazev: d.nazev, popis: d.popis,
    stitky: (d.stitky || []).join(", "), cena: String(prods[0]?.cena ?? d.cena ?? ""), mnozstvi: String(prods[0]?.mnozstvi ?? d.mnozstvi ?? ""),
    sku: prods.length === 1 ? prods[0].sku : "", doprava: d.doprava ?? o.doprava?.[0]?.id ?? "", zpracovani: d.zpracovani ?? o.zpracovani?.[0]?.id ?? "",
    kategorie: (o.kategorie || []).find(x => x[0] === d.kategorie)?.[1] || "", odhad: false, url: d.url });
  p.lastCat = p.kategorie;
  p.perso = (d.personalizace || []).map(q => ({ ...q, opts: q.opts || [] }));
  p.obrazky = (d.obrazky || []).map(i => ({ id: i.id, url: i.url, on: true, file: { name: "", size: 0 } }));
  p.soubory = (d.soubory || []).map(f => ({ id: f.id, on: true, file: { name: f.nazev, size: 0, label: f.velikost || "" } }));
  (d.atributy || []).forEach(a => p.attrs[a.property_id] = { ids: a.value_ids || [], vals: a.values || [], scale: a.scale_id || "" });
  if (prods.length > 1 || prods.some(x => x.hodnoty.length)) {
    const first = prods[0].hodnoty;
    p.vars = first.map((h0, i) => {
      const custom = CUSTOM_PIDS.includes(h0.property_id);
      const v = { pid: custom ? "custom" : h0.property_id, nazev: h0.nazev, scale: h0.scale_id || "", hodnoty: [], text: "" };
      prods.forEach(pr => { const h = pr.hodnoty[i]; if (h && !v.hodnoty.some(x => x.nazev === h.hodnota)) v.hodnoty.push({ id: custom ? null : h.value_id, nazev: h.hodnota }); });
      return v;
    });
    for (const [f, key] of [["cena", "cena_dle"], ["mnozstvi", "mnozstvi_dle"], ["sku", "sku_dle"]])
      p.dle[f] = (d[key] || []).map(pid => first.findIndex(h => h.property_id === pid)).filter(i => i >= 0);
    const seen = new Set();
    prods.forEach(pr => {
      const combo = pr.hodnoty.map(h => ({ nazev: h.hodnota })), full = combo.map(h => h.nazev).join(SEP);
      seen.add(full);
      if (p.dle.cena.length) p.kc[subKey(p, "cena", combo)] = String(pr.cena);
      if (p.dle.mnozstvi.length) p.kq[subKey(p, "mnozstvi", combo)] = String(pr.mnozstvi);
      if (p.dle.sku.length) p.ks[subKey(p, "sku", combo)] = pr.sku;
      if (!pr.aktivni) p.koff[full] = true;
    });
    combos(p).forEach(c => { const full = c.map(h => h.nazev).join(SEP); if (!seen.has(full)) p.koff[full] = true; });
  }
  return p;
}

async function nlBody4Api(p) {

  const big = files.find(f => !f.id && f.file.size > 20 * 1048576); if (big) throw new Error(t("nlTooBig", { f: big.file.name }));

  return { shop_id: $("#nlShop").value, typ: p.typ, nazev: p.nazev, popis: p.popis, cena: p.cena, mnozstvi: p.mnozstvi,
    stitky: tagList(p.stitky), kategorie: catId(p.kategorie), doprava_id: p.doprava, zpracovani_id: p.zpracovani, ...nlPayload(p),
    obrazky: await enc(p.obrazky.filter(i => i.on)), soubory: await enc(files) };

  try {
    for (const [shop_id, ids] of Object.entries(byShop))
      await api("/api/sleva", { shop_id, ids, procento: $("#salePct").value, od: $("#saleFrom").value, do: $("#saleTo").value });
    msg($("#saleMsg"), t("saleDone"), true); LSEL.clear();
    setTimeout(() => { $("#sale").close(); $("#ldetail").open && $("#ldetail").close(); }, 900);
    await load(); setTimeout(load, 5000);
  } catch (e) { msg($("#saleMsg"), e.message); }
};
async function cancelSale(id) {
  if (!confirm(t("saleConfirmCancel"))) return;
  try { await api("/api/sleva/zrusit", { id }); $("#ldetail").close(); await load(); } catch (e) { alert(e.message); }
}
$("#lBulk").onclick = e => {
  const a = e.target.closest("[data-bulk]")?.dataset.bulk; if (!a) return;
  const ids = [...LSEL];
  if (a === "clear") { LSEL.clear(); renderListings(filtered()); }
  else if (a === "sale") openSale(ids);
  else listingAction(a, ids);
};
$("#ltable").addEventListener("change", e => {
  if (e.target.id === "lSelAll") { LROWS.filter(l => l.listing_id > 0 && shopIdOf(l.shop)).forEach(l => e.target.checked ? LSEL.add(l.listing_id) : LSEL.delete(l.listing_id)); renderListings(filtered()); return; }
  const id = +e.target.dataset.sel; if (!id) return;
  e.target.checked ? LSEL.add(id) : LSEL.delete(id); renderBulk();
  const all = $("#lSelAll"); if (all) all.checked = LROWS.filter(l => l.listing_id > 0 && shopIdOf(l.shop)).every(l => LSEL.has(l.listing_id));
});

// detail listingu: akce, atributy, varianty a slevy
async function listingExtra(l) {
  const shop = shopIdOf(l.shop), box = $("#ldExtra");
  const sales = (RAW.slevy || []).filter(s => s.listing_id === l.listing_id);
  const salesHtml = sales.length ? `<h4>${esc(t("ldSales"))}</h4><ul class="list">${sales.map(s => `<li><span>${esc(t("salePill", { p: +s.procento.toFixed(1) }))} · ${esc(new Date(s.od_ts * 1000).toLocaleDateString(loc()))} – ${esc(new Date((s.do_ts - 1) * 1000).toLocaleDateString(loc()))} · ${esc(tMap("saleStates", s.stav) || s.stav)}${s.chyba ? ` <span class="neg">${esc(s.chyba)}</span>` : ""}</span>${s.stav === "naplanovano" || s.stav === "bezi" ? `<button class="linkbtn" data-cancel-sale="${s.id}">${esc(t("saleCancel"))}</button>` : "<span></span>"}</li>`).join("")}</ul>` : "";
  if (!shop || !(l.listing_id > 0) || S.demo) { box.innerHTML = salesHtml; return; }
  box.innerHTML = salesHtml + `<p class="hint">${esc(t("ldLoading"))}</p>`;
  try {
    const d = await api(`/api/listing/detail?shop=${encodeURIComponent(shop)}&id=${l.listing_id}`);
    const prods = d.produkty || [], hasVar = prods.length > 1 || prods.some(x => x.hodnoty.length);
    const attrs = (d.atributy || []).map(a => `<span class="chip"><span class="hint">${esc(a.nazev)}:</span> ${esc((a.values || []).join(", "))}${a.scale_id ? "" : ""}</span>`).join("");
    const cols = hasVar ? prods[0].hodnoty.map(h => h.nazev) : [];
    const vars = hasVar ? `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}<th class="num">${esc(t("colPrice"))}</th><th class="num">${esc(t("colStock"))}</th><th>SKU</th><th>${esc(t("nlVarOn"))}</th></tr></thead><tbody>${prods.map(pr => `<tr>${pr.hodnoty.map(h => `<td>${esc(h.hodnota)}</td>`).join("")}<td class="num">${fmtMoney(pr.cena, l.mena)}</td><td class="num">${pr.mnozstvi ?? "–"}</td><td>${esc(pr.sku || "–")}</td><td>${pr.aktivni ? "✓" : "–"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">${esc(t("ldNoVars"))}</p>`;
    const perso = (d.personalizace || []).length ? `<ul class="list">${d.personalizace.map(q => `<li><span><b>${esc(q.text)}</b>${q.req ? " *" : ""} <span class="hint">· ${esc(tMap("pqTypes", q.typ) || q.typ)}${q.opts.length ? ": " + esc(q.opts.join(", ")) : q.max ? ` · max ${q.max}` : ""}</span>${q.instr ? `<br><span class="hint">${esc(q.instr)}</span>` : ""}</span><span></span></li>`).join("")}</ul>` : `<p class="hint">${esc(t("pqNone"))}</p>`;
    if (!$("#ldetail").open || LDCUR !== l) return;
    box.innerHTML = salesHtml + `<h4>${esc(t("ldAttrs"))}</h4>${attrs ? `<div class="chips">${attrs}</div>` : `<p class="hint">${esc(t("ldNoAttrs"))}</p>`}<h4>${esc(t("ldVars"))}</h4>${vars}<h4>${esc(t("pqTitle"))}</h4>${perso}`;
  } catch (e) { if (LDCUR === l) box.innerHTML = salesHtml + `<p class="hint nl-bad">${esc(e.message)}</p>`; }
}
let LDCUR = null;
function ldActions(l) {
  const shop = shopIdOf(l.shop);
  if (!shop || !(l.listing_id > 0)) return "";
  const act = l.stav === "active" ? `<button class="btn" data-ld="inactive">${esc(t("nlDeactivate"))}</button>` : `<button class="btn" data-ld="active">${esc(t("nlActivate"))}</button>`;
  return `<div class="actions left ld-actions"><a class="btn primary" href="#upravit/${esc(shop)}/${l.listing_id}">${esc(t("lEdit"))}</a>${act}<button class="btn" data-ld="sale">${esc(t("lSale"))}</button><button class="btn danger" data-ld="smazat">${esc(t("lDelete"))}</button></div>`;
}
$("#ldetail").addEventListener("click", e => {
  const c = e.target.closest("[data-cancel-sale]"); if (c) { cancelSale(+c.dataset.cancelSale); return; }
  const a = e.target.closest("[data-ld]")?.dataset.ld; if (!a || !LDCUR) return;
  if (a === "sale") openSale([LDCUR.listing_id]); else listingAction(a, [LDCUR.listing_id]);
  if (e.target.closest("a[href^='#upravit']")) $("#ldetail").close();
});
$("#ldetail").addEventListener("click", e => { if (e.target.closest("a[href^='#upravit']")) $("#ldetail").close(); });

applyStatic();
$("#status").textContent = t("loading");
route();
load().then(() => { if (page === "nastaveni") fillSettings(); });
setInterval(load, 60000);
</script>
</body>
