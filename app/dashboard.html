<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etsy Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23f1641e'/><path d='M10 22v-5M16 22V11M22 22v-8' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efefef; --panel: #ffffff; --panel-2: #f5f5f5; --side: #ffffff; --text: #171717; --muted: #737373; --faint: #a3a3a3;
  --line: #ececec; --accent: #171717; --accent-fg: #ffffff; --brand: #45a86b; --brand-soft: #e7f5ec;
  --good: #2f9e5b; --good-soft: #e3f4e8; --bad: #d64545; --bad-soft: #fbe7e7; --warn: #c77c12; --warn-soft: #fbf0dc;
  --shop-1: #6b7cf6; --shop-2: #e2a33b; --shop-3: #2bb3a6; --shop-4: #b36bdc;
  --shadow: none; --radius: 14px; --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #0e0e0e; --panel: #1b1b1b; --panel-2: #242424; --side: #1b1b1b; --text: #f2f2f2; --muted: #9a9a9a; --faint: #666;
  --line: #2a2a2a; --accent: #f2f2f2; --accent-fg: #111; --brand: #5cc185; --brand-soft: #173222;
  --good: #5cc185; --good-soft: #173222; --bad: #ef6b6b; --bad-soft: #3a1b1b; --warn: #e5a13a; --warn-soft: #36270f; --shop-1: #8b98fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --panel: #1b1b1b; --panel-2: #242424; --side: #1b1b1b; --text: #f2f2f2; --muted: #9a9a9a; --faint: #666;
    --line: #2a2a2a; --accent: #f2f2f2; --accent-fg: #111; --brand: #5cc185; --brand-soft: #173222;
    --good: #5cc185; --good-soft: #173222; --bad: #ef6b6b; --bad-soft: #3a1b1b; --warn: #e5a13a; --warn-soft: #36270f; --shop-1: #8b98fa;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono, .kpi .value, .big, .num { font-family: var(--mono); font-feature-settings: "zero" 0; }

/* rozvržení: boční menu jako karta + obsah */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; gap: 10px; padding: 10px; }
.side { background: var(--side); border-radius: var(--radius); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 10px; height: calc(100vh - 20px); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14.5px; padding: 4px 8px 20px; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--text); display: grid; place-items: center; }
.brand .logo svg { stroke: var(--text); stroke-width: 2.6; width: 14px; height: 14px; }
.nav-label { display: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 13.5px; }
.nav a svg.i { color: var(--muted); }
.nav a:hover { background: var(--panel-2); }
.nav a.on { background: var(--panel-2); font-weight: 500; }
.nav a.on svg.i { color: var(--text); }
.side .grow { flex: 1; }
.side-card { border-top: 1px solid var(--line); padding: 14px 8px 4px; font-size: 12.5px; color: var(--muted); }
.side-card b { color: var(--text); display: block; margin-bottom: 3px; font-size: 13px; font-weight: 500; }
.side-card .btn { width: 100%; margin-top: 10px; justify-content: center; }
.side .ver { font-size: 11.5px; color: var(--faint); padding: 10px 8px 0; font-family: var(--mono); }
main { min-width: 0; padding: 22px 22px 50px; background: var(--bg); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 22px; }
.top h1 { font-size: 28px; margin: 0; letter-spacing: -.03em; line-height: 1.15; font-weight: 500; }
.top .status { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.status .err { color: var(--bad); }
.spacer { flex: 1; }
.demo { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 500; vertical-align: middle; margin-left: 8px; letter-spacing: .04em; }

/* ovládací prvky */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { opacity: .88; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
select, input, textarea { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 9px; font-size: 13.5px; }
.filters select { font-size: 13px; font-weight: 500; padding: 7px 10px; }
select { cursor: pointer; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--text) 18%, transparent); outline-offset: 0; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.seg button.on { background: var(--panel-2); color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* karty */
.grid { display: grid; gap: 10px; }
.card { background: var(--panel); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { font-size: 14px; margin: 0; font-weight: 400; color: var(--muted); }
.card-h .note { color: var(--text); font-size: 12.5px; display: block; margin-top: 10px; }
.kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 10px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.kpi .value { font-size: 23px; font-weight: 400; letter-spacing: -.02em; line-height: 1.25; margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kpi .value small { font-size: 14px; }
.kpi .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
.kpi.warn .value { color: var(--warn); }
.arrow { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-family: Inter, sans-serif; flex: none; }
.arrow.up { background: var(--good-soft); color: var(--good); } .arrow.down { background: var(--bad-soft); color: var(--bad); }
.trend { display: inline-flex; align-items: center; font-weight: 500; font-size: 11.5px; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); }
.trend.up { color: var(--good); background: var(--good-soft); } .trend.down { color: var(--bad); background: var(--bad-soft); }
.kpi .head .trend { margin-left: auto; }
.row2 { grid-template-columns: 1.6fr 1fr; margin-bottom: 10px; }
.halves { grid-template-columns: 1fr 1fr; margin-bottom: 10px; }
.big { font-size: 30px; font-weight: 400; letter-spacing: -.03em; line-height: 1.1; }
.headline { margin-left: auto; text-align: right; }
.headline .lbl { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-bottom: 4px; }
.headline .val { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg text { fill: var(--faint); font-size: 11px; font-family: Inter, sans-serif; }
.tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.08); padding: 7px 10px; border-radius: 8px; font-size: 12px; display: none; z-index: 20; white-space: nowrap; }
.tip .t { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 8px 0; font-size: 13px; }
.list li + li { border-top: 1px solid var(--line); }
.list .meter { grid-column: 1 / -1; height: 4px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.list .meter i { display: block; height: 100%; border-radius: 99px; }
.list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.banner { background: var(--panel); border-radius: var(--radius); padding: 14px 20px; margin-bottom: 10px; display: none; border-left: 3px solid var(--brand); }
.banner ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.banner .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; }
.banner b { font-weight: 500; }

/* tabulky */
.tablewrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 6px 10px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.nw { white-space: nowrap; }
td.items { max-width: 380px; }
tr.new td { background: var(--brand-soft); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ship { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--good-soft); color: var(--good); }
.search { min-width: 200px; flex: 1 1 240px; max-width: 420px; background: var(--panel-2); border-color: transparent; }
.more { text-align: center; margin-top: 14px; }
.tfilters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: -4px 0 14px; }
.tfilters label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.tfilters input, .tfilters select, .tfilters .btn { height: 34px; box-sizing: border-box; }
.tfilters input, .tfilters select { background: var(--panel-2); border-color: transparent; font-size: 13px; padding: 0 10px; color: var(--text); }
.tfilters select { max-width: 240px; }
.tsum { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.tsum b { color: var(--text); font-weight: 500; font-family: var(--mono); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover, th.sorted { color: var(--text); }
.empty { color: var(--muted); padding: 28px 0; text-align: center; font-size: 13px; }
.linkbtn { background: none; border: 0; color: var(--text); cursor: pointer; font-weight: 500; padding: 0; text-decoration: none; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }

/* nastavení */
.settings { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.settings .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 500; }
.field { margin-top: 14px; }
.field label, .flabel { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: var(--panel-2); border-color: transparent; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; align-items: center; }
.actions.left { justify-content: flex-start; }
.shoprow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel-2); border-radius: 10px; margin-top: 8px; font-size: 13.5px; }
.shoprow b { font-weight: 500; }
.msg { font-size: 13px; margin-top: 8px; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
.danger-zone h2 { color: var(--bad); }
.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13.5px; }

/* import a uvítání */
dialog { border: 0; border-radius: 18px; background: var(--panel); color: var(--text); width: min(580px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 22px 24px; }
.dlg h3 { margin: 0 0 4px; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
.drop { border: 1.5px dashed var(--faint); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); background: var(--panel-2); font-size: 13.5px; }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .link { display: inline; color: var(--text); cursor: pointer; text-decoration: underline; margin: 0; font-size: inherit; font-weight: 500; }
#impResults li { grid-template-columns: 1fr auto; }
.welcome { max-width: 680px; }
.welcome h2 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.02em; font-weight: 500; }
.welcome ol { padding-left: 20px; } .welcome li { margin: 6px 0; }
.welcome a { text-decoration: underline; }
.page[hidden] { display: none; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .row2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; padding: 0; gap: 0; }
  .side { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; padding: 8px 12px; border-radius: 0; border-bottom: 1px solid var(--line); overflow-x: auto; gap: 4px; }
  .brand { padding: 0 6px 0 0; } .brand span { display: none; }
  .nav { flex-direction: row; gap: 4px; } .nav a { padding: 7px 10px; white-space: nowrap; }
  .side .grow, .side-card, .side .ver { display: none; }
  main { padding: 18px 12px 50px; }
  .halves, .settings { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr; gap: 8px; } .kpi .value { font-size: 18px; } .card { padding: 14px 14px; } .tablewrap { margin: 0 -14px; padding: 0 14px; } .search { min-width: 0; flex: 1; } .tfilters label { flex: 1 1 40%; } .tfilters select { max-width: none; } .nav a span { display: none; } .top h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M6 18v-4M12 18V7M18 18v-7"/></svg></span><span>Etsy Dashboard</span></div>
    <div class="nav-label" data-i18n="navMenu"></div>
    <nav class="nav">
      <a href="#prehled" data-page="prehled"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-i18n="navOverview"></span></a>
      <a href="#objednavky" data-page="objednavky"><svg class="i" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span data-i18n="tabOrders"></span></a>
      <a href="#vypis" data-page="vypis"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="navLedger"></span></a>
      <a href="#nastaveni" data-page="nastaveni"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="settingsTitle"></span></a>
    </nav>
    <div class="grow"></div>
    <div class="side-card"><b data-i18n="sideImportTitle"></b><span data-i18n="sideImportText"></span>
      <button class="btn primary" onclick="openImport()"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span data-i18n="uploadCsv"></span></button></div>
    <div class="ver">v<span id="sideVer"></span></div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1><span id="pageTitle"></span><span id="demoBadge" class="demo" data-i18n="demo" hidden></span></h1>
        <div class="status" id="status"></div>
      </div>
      <div class="spacer"></div>
      <div class="filters" id="filters">
        <div class="seg" id="shopChips"></div>
        <select id="period" data-i18n-aria="period"></select>
        <button class="btn" id="checkBtn"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg><span data-i18n="checkShort"></span></button>
      </div>
    </div>

    <!-- přehled -->
    <section class="page" id="page-prehled">
      <div id="welcome" class="card welcome" hidden>
        <h2 data-i18n="welcomeTitle"></h2>
        <p data-i18n="welcomeCsv"></p>
        <button class="btn primary" onclick="openImport()"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span data-i18n="uploadCsv"></span></button>
        <p style="margin-top:22px" data-i18n="welcomeApi"></p>
        <ol><li data-i18n="welcomeStep1"></li><li data-i18n="welcomeStep2"></li><li data-i18n="welcomeStep3"></li></ol>
        <a class="btn" href="#nastaveni" data-i18n="openSettings"></a>
      </div>
      <div id="overview" hidden>
        <div class="banner" id="banner">
          <div class="row"><b id="bannerTitle"></b><div class="spacer"></div><button class="btn" id="bannerOk" data-i18n="bannerOk"></button></div>
          <ul id="bannerList"></ul>
        </div>
        <div class="grid kpis" id="kpis"></div>
        <div class="grid row2">
          <div class="card">
            <div class="card-h"><div><h2 data-i18n="chartTitle"></h2><span class="note" id="chartNote"></span></div><div class="headline" id="chartHead"></div></div>
            <div id="chart"></div>
            <div class="legend" id="legend"></div>
          </div>
          <div class="card">
            <div class="card-h"><div><h2 data-i18n="topTitle"></h2><span class="note" data-i18n="topNote"></span></div></div>
            <ul class="list" id="top"></ul>
          </div>
        </div>
        <div class="grid row2">
          <div class="card">
            <div class="card-h"><h2 data-i18n="recentOrders"></h2><div class="spacer"></div><a class="linkbtn" href="#objednavky" data-i18n="viewAll"></a></div>
            <div class="tablewrap"><table id="recent"></table></div>
          </div>
          <div class="card">
            <div class="card-h"><div><h2 data-i18n="feesTitle"></h2><span class="note" data-i18n="feesNote"></span></div></div>
            <ul class="list" id="fees"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- objednávky a výpis -->
    <section class="page" id="page-tabulka" hidden>
      <div class="card">
        <div class="card-h">

function convertData() {
  const k = RATES?.kurzy;
  if (!CUR || !k || !k[CUR]) { D = RAW; return; }
  const cv = (v, from) => v === null || v === undefined || !k[from] ? v : v / k[from] * k[CUR];
  const map = (r, keys) => {
    if (r.mena === CUR || !k[r.mena]) return r;
    const o = { ...r, mena: CUR, puv: [r[keys[0]], r.mena] };
    keys.forEach(x => o[x] = cv(r[x], r.mena)); return o;
  };

function trend(cur, prev) {  // štítek s procentem a šipka k hodnotě

  if (Math.abs(p) > 999) return null;  // srovnání s téměř prázdným obdobím nic neříká
  return { p, up, pill: `<span class="trend ${up ? "up" : "down"}">${up ? "+" : "−"}${Math.abs(p)}%</span>`,
    arrow: `<span class="arrow ${up ? "up" : "down"}">${up ? "↑" : "↓"}</span>` };
}

let CH = null;  // data grafu pro tooltip
function smooth(pts) {  // hladká křivka přes body (Catmull-Rom → Bézier)
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function renderChart(f) {

  const cur = (f.orders[0] || {}).mena || "USD";
  const all = months.map(([y, m]) => shops.map(s => f.orders.filter(r => {
    const d = new Date(r.vytvoreno_ts * 1000); return r.shop === s && r.mena === cur && d.getFullYear() === y && d.getMonth() === m;
  }).reduce((a, r) => a + r.celkem, 0)));

  $("#chartNote").textContent = t("chartNote");
  $("#chartHead").innerHTML = `<div class="lbl"><span class="dot" style="background:var(--brand)"></span>${esc(t("chartTotalNote"))}</div><div class="val"><span class="big">${esc(fmtMoney(sum12, cur))}</span>${tr ? tr.pill : ""}</div>`;
  const totals = vals.map(v => v.reduce((a, b) => a + b, 0));
  const series = [totals].concat(shops.length > 1 ? shops.map((s, si) => vals.map(v => v[si])) : []);
  const max = Math.max(1, ...series.flat());
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const W = Math.max(300, $("#chart").clientWidth || 800), H = 270, L = 46, R = 8, B = 30, T0 = 10;
  const x = i => L + (W - L - R) * (i / 11), y = v => H - B - (v / top) * (H - B - T0);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;max-width:100%" role="img" aria-label="${esc(t("chartTitle"))}">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".22"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>`;
  for (let g = 0; g <= top; g += step)
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-dasharray="${g ? "2 4" : ""}"/><text x="${L - 10}" y="${y(g) + 4}" text-anchor="end">${Math.round(g).toLocaleString(loc())}</text>`;
  series.forEach((ser, si) => {

    const col = si ? shopColor(shops[si - 1]) : "var(--brand)";
    if (si === 0) svg += `<path d="${d} L${x(11)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#ga)"/>`;
    svg += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${si === 0 ? 2.2 : 1.4}" ${si ? 'stroke-dasharray="4 3" opacity=".85"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg += `<g id="hover" style="display:none"><line id="hl" y1="${T0}" y2="${H - B}" stroke="var(--faint)" stroke-dasharray="3 3"/>${series.map((_, si) => `<circle id="hc${si}" r="${si ? 3.5 : 4.5}" fill="var(--panel)" stroke="${si ? shopColor(shops[si - 1]) : "var(--brand)"}" stroke-width="2"/>`).join("")}</g>`;
  ms.forEach(([yy, m], i) => svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === 11 ? "end" : "middle"}">${esc(monthName(m, undefined, true))}</text>`);
  $("#chart").innerHTML = svg + "</svg>";

}
function niceStep(max) { const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw); }

// ---------- filtry a řazení Objednávek a Výpisu
const TF_DEF = { from: "", to: "", what: "", state: "", sort: "date-desc" };
const TF = { objednavky: { ...TF_DEF, ...LS.get("tf_objednavky", {}) }, vypis: { ...TF_DEF, ...LS.get("tf_vypis", {}) } };
const SORT_KEYS = { objednavky: ["date", "amount", "qty", "state"], vypis: ["date", "amount", "type"] };
const SORT_ASC_FIRST = { state: 1, type: 1 };  // text se řadí od A, čísla od největšího

function stateLabel(k) { return k === "_ship" ? t("kToShip") : tMap("statuses", k) || k || "–"; }
function typeLabel(k) { return tMap("types", k) || tMap("types", (k || "").toLowerCase()) || k || "–"; }
function dayTs(v, end) { return v ? new Date(v + "T00:00:00").getTime() / 1000 + (end ? 86400 : 0) : null; }

function fillTableFilters(base, orders, st) {

    sel.value = list.some(o => o[0] === cur) ? cur : "";

  };

  $("#fStateL").textContent = orders ? t("colStatus") : t("fDir");
  if (orders) {

    st.what = opts($("#fWhat"), t("fAllItems"), names.map(n => [n, n]), st.what);
    const states = [...new Set(base.map(orderState))].sort((a, b) => (a === "_ship" ? -1 : b === "_ship" ? 1 : coll.compare(stateLabel(a), stateLabel(b))));
    st.state = opts($("#fState"), t("fAllStates"), states.map(k => [k, stateLabel(k)]), st.state);
  } else {

function renderTable(f) {

  fillTableFilters(base, orders, st);
  const ts = r => orders ? r.vytvoreno_ts : r.datum_ts, amt = r => orders ? r.celkem : r.castka;
  const a = dayTs(st.from) ?? -Infinity, b = dayTs(st.to, true) ?? Infinity;
  const q = $("#search").value.trim().toLowerCase();
  const match = r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q));
  let rows = base.filter(r => ts(r) >= a && ts(r) < b && match(r));
  if (orders) {
    if (st.what) rows = rows.filter(r => itemNames(r).includes(st.what));
    if (st.state) rows = rows.filter(r => orderState(r) === st.state);
  } else {
    if (st.what) rows = rows.filter(r => r.typ === st.what);
    if (st.state) rows = rows.filter(r => st.state === "in" ? r.castka > 0 : r.castka < 0);
  }
  const [key, dir] = st.sort.split("-"), sgn = dir === "asc" ? 1 : -1, coll = new Intl.Collator(loc());

  $("#banner").style.display = "block";
  $("#bannerTitle").textContent = t("bannerTitle", { o: pl(nO.length, "order"), l: pl(nL.length, "move") });
  $("#bannerList").innerHTML = nO.slice(0, 5).map(r => `<li>🛒 <b>${esc(r.shop)}</b>: ${esc(t("bannerItem", { total: fmtMoney(r.celkem, r.mena), buyer: r.zakaznik }))} (${esc(r.polozky)})</li>`).join("") +
    (nO.length > 5 ? `<li>${esc(t("andMore", { n: nO.length - 5 }))}</li>` : "");
}

function renderStatus() {
  const errs = Object.entries(S.chyby || {});
  $("#checkBtn").hidden = !S.nastaveno;
  $("#status").innerHTML = esc(S.bezi ? t("checking") : S.nastaveno ? t("lastCheck", { t: ago(S.posledni_kontrola) }) : t("csvOnly")) +
    errs.map(([s, e]) => `<br><span class="err">⚠ ${esc(s)}: ${esc(e)}</span>`).join("");
  $("#demoBadge").hidden = !S.demo;
  $("#sideVer").textContent = S.verze || "";
}

function render() {
  renderStatus();
  const ready = S.shopy.length > 0;
  $("#filters").style.display = page === "nastaveni" || !ready ? "none" : "";
  if (page === "nastaveni") return;
  $("#welcome").hidden = ready; $("#overview").hidden = !ready;
  if (!ready) return;
  renderChips();
  const f = filtered();
  if (page === "prehled") { renderBanner(); renderKpis(f); renderChart(f); renderTop(f); renderRecent(f); renderFees(f); }
  else renderTable(f);
}

// ---------- načítání a upozornění
let notified = LS.get("notified", 0);
async function load() {
  try {
    S = await api("/api/stav");
    RAW = await api("/api/data");
    if (!RATES || Date.now() / 1000 - (RATES.stazeno || 0) > 12 * 3600) RATES = await api("/api/kurzy").catch(() => RATES);
    convertData();
    const prev = $("#period").value; buildPeriods(); if (prev) $("#period").value = prev;
    render();
    notifyNew();
    syncServerLang();
  } catch (e) { $("#status").innerHTML = `<span class="err">${esc(t("notRunning"))} ${esc(e.message)}</span>`; }
}
function notifyNew() {
  const newest = Math.max(0, ...D.objednavky.map(r => r.pridano_ts), ...D.vypis.map(r => r.pridano_ts));
  if (!notified) { notified = newest; LS.set("notified", newest); return; }
  if (newest <= notified) return;
  const nO = D.objednavky.filter(r => r.pridano_ts > notified);
  notified = newest; LS.set("notified", newest);
  if (!nO.length || !("Notification" in window) || Notification.permission !== "granted") return;
  new Notification(nO.length === 1 ? t("newOrder") : t("newOrders", { n: nO.length }),
    { body: nO.slice(0, 3).map(r => `${r.shop}: ${fmtMoney(r.celkem, r.mena)} (${r.polozky})`).join("\n") });
}
function renderNotif() {
  const ok = "Notification" in window, p = ok ? Notification.permission : "denied";
  $("#notifBtn").hidden = p !== "default";
  $("#notifState").textContent = p === "granted" ? t("notifOn") : p === "denied" && ok ? t("notifBlocked") : "";
}
$("#notifBtn").onclick = async () => { await Notification.requestPermission(); renderNotif(); };

// ---------- nastavení
function fillSettings() {
  const n = S.nastaveni;
  if (document.activeElement?.closest?.("#page-nastaveni input, #page-nastaveni textarea")) return;  // nepřepisovat rozepsané
  $("#keystring").value = n.keystring || ""; $("#secret").value = "";
  $("#secret").placeholder = n.ma_secret ? t("secretSaved") : "";
  $("#redirect").value = n.redirect_uri || ""; $("#interval").value = n.interval_minut || 15; $("#ntfy").value = n.ntfy_topic || "";
  $("#verze").textContent = S.verze || "";
  renderShopList(); buildCurrency(); renderNotif(); applyTheme();
}
function renderShopList() {
  $("#shopList").innerHTML = S.shopy.length ? S.shopy.map(s =>
    `<div class="shoprow"><span class="dot" style="background:${shopColor(s.name)}"></span><b>${esc(s.name)}</b><div class="spacer"></div>${s.id ? `<button class="btn ghost" data-remove="${esc(s.id)}">${t("remove")}</button>` : ""}</div>`).join("")
    : `<p class="hint">${t("noShops")}</p>`;
}
function msg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
$("#saveBtn").onclick = async () => {
  try {
    await api("/api/nastaveni", { keystring: $("#keystring").value, shared_secret: $("#secret").value,
      redirect_uri: $("#redirect").value, interval_minut: +$("#interval").value, jazyk: LANG });
    msg($("#saveMsg"), t("saved"), true); S = await api("/api/stav"); render();
  } catch (e) { msg($("#saveMsg"), e.message); }
};
$("#ntfySave").onclick = async () => {
  try { await api("/api/nastaveni", { ntfy_topic: $("#ntfy").value, jazyk: LANG }); msg($("#ntfyMsg"), t("saved"), true); S = await api("/api/stav"); }
  catch (e) { msg($("#ntfyMsg"), e.message); }
};
$("#authStart").onclick = async () => {
  try { const { url } = await api("/api/prihlasit/start", {}); window.open(url, "_blank"); $("#authStep").hidden = false; $("#authUrl").value = ""; $("#authMsg").textContent = ""; }
  catch (e) { msg($("#authMsg"), e.message); }
};
$("#authFinish").onclick = async () => {
  try { const r = await api("/api/prihlasit/dokoncit", { url: $("#authUrl").value });
    msg($("#authMsg"), t("shopConnected", { shop: r.shop }), true);
    $("#authStep").hidden = true; setTimeout(load, 3000); S = await api("/api/stav"); renderShopList(); }
  catch (e) { msg($("#authMsg"), e.message); }
};
$("#updBtn").onclick = async () => {
  const b = $("#updBtn"); b.disabled = true; msg($("#updMsg"), t("updSearching"), true);
  try {
    const r = await api("/api/aktualizace", {});
    if (!r.nova) msg($("#updMsg"), t("updLatest", { v: r.verze }), true);
    else { msg($("#updMsg"), t("updInstalling", { v: r.verze }), true); setTimeout(() => location.reload(), 5000); }
  } catch (e) { msg($("#updMsg"), t("updFailed") + e.message); }
  b.disabled = false;
};
$("#unBtn").onclick = async () => {
  const del = $("#unDelete").checked;
  if (!confirm(del ? t("unConfirmDel") : t("unConfirm"))) return;
  try { await api("/api/odinstalovat", { smazat_data: del }); } catch (e) { alert(e.message); return; }
  document.body.innerHTML = `<main style="max-width:640px;margin:60px auto"><div class="card welcome"><h2>${t("unDoneTitle")}</h2>
    <p>${t("unDoneText")} ${del ? t("unDataDeleted") : t("unDataKept")}</p>
    <p>${t("unDoneText2")}</p></div></main>`;
};
$("#shopList").onclick = async e => {
  const id = e.target.dataset.remove; if (!id || !confirm(t("removeConfirm"))) return;
  try { await api("/api/odebrat", { id }); S = await api("/api/stav"); fillSettings(); } catch (err) { alert(err.message); }
};
$("#lang").onchange = () => {
  LANG = $("#lang").value; LS.set("lang", LANG); applyStatic();
  $("#pageTitle").textContent = t(PAGES[page]);
  if (!S) return;
  const prev = $("#period").value; buildPeriods(); $("#period").value = prev;
  renderShopList(); buildCurrency(); renderNotif();
  $("#secret").placeholder = S.nastaveni.ma_secret ? t("secretSaved") : "";
  render(); syncServerLang();
};
$("#currency").onchange = async () => {
  CUR = $("#currency").value; LS.set("currency", CUR);
  if (CUR && !RATES?.kurzy) RATES = await api("/api/kurzy").catch(() => null);
  buildCurrency(); convertData();
  if (!S) return;
  const prev = $("#period").value; buildPeriods(); $("#period").value = prev; render();
};
$("#themeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; THEME = b.dataset.theme; LS.set("theme", THEME); applyTheme(); };

// ---------- ovládání
$("#checkBtn").onclick = async () => {
  const b = $("#checkBtn"); b.disabled = true;
  try { await api("/api/zkontrolovat", {}); } catch (e) { alert(e.message); }
  b.disabled = false; load();
};
$("#shopChips").onclick = e => { const c = e.target.closest("button"); if (!c) return; shopFilter = c.dataset.shop; LS.set("shop", shopFilter); shown = 25; render(); };
$("#period").onchange = () => { LS.set("period", $("#period").value); shown = 25; render(); };
$("#search").oninput = () => { shown = 25; renderTable(filtered()); };
const tfSet = (k, v) => { TF[page][k] = v; saveTF(); shown = 25; renderTable(filtered()); };
$("#fFrom").onchange = e => tfSet("from", e.target.value);
$("#fTo").onchange = e => tfSet("to", e.target.value);
$("#fWhat").onchange = e => tfSet("what", e.target.value);
$("#fState").onchange = e => tfSet("state", e.target.value);
$("#fSort").onchange = e => tfSet("sort", e.target.value);
$("#fReset").onclick = () => { TF[page] = { ...TF_DEF }; $("#search").value = ""; saveTF(); shown = 25; renderTable(filtered()); };
$("#table").onclick = e => {
  const th = e.target.closest("th[data-sort]"); if (!th) return;
  const k = th.dataset.sort, [ck, cd] = TF[page].sort.split("-");
  tfSet("sort", k === ck ? `${k}-${cd === "asc" ? "desc" : "asc"}` : `${k}-${SORT_ASC_FIRST[k] ? "asc" : "desc"}`);
};
$("#moreBtn").onclick = () => { shown += 50; renderTable(filtered()); };
$("#bannerOk").onclick = () => { lastSeen = Math.floor(Date.now() / 1000); LS.set("lastSeen", lastSeen); render(); };
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S && page === "prehled" && S.shopy.length) renderChart(filtered()); }, 150); });
const tip = $("#tip");
$("#chart").onmousemove = e => {
  const svg = $("#chart svg"); if (!CH || !svg) return;
  const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * CH.W / r.width;
  const i = Math.max(0, Math.min(11, Math.round((px - CH.L) / ((CH.W - CH.L - CH.R) / 11))));
  const hx = CH.x(i); $("#hover").style.display = ""; $("#hl").setAttribute("x1", hx); $("#hl").setAttribute("x2", hx);
  CH.series.forEach((ser, si) => { const c = $("#hc" + si); c.setAttribute("cx", hx); c.setAttribute("cy", CH.y(ser[i])); });
  const [yy, m] = CH.ms[i];
  tip.innerHTML = `<div class="t">${esc(monthName(m, yy))}</div>` + (CH.shops.length > 1
    ? CH.shops.map((s, si) => `<div><span class="dot" style="background:${shopColor(s)}"></span> ${esc(s)}: <b class="mono">${esc(fmtMoney(CH.vals[i][si], CH.cur))}</b></div>`).join("") : "")
    + `<div><b class="mono">${esc(fmtMoney(CH.totals[i], CH.cur))}</b></div>`;
  tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 14 + "px";
};
$("#chart").onmouseleave = () => { tip.style.display = "none"; const h = $("#hover"); if (h) h.style.display = "none"; };

// ---------- import CSV
function openImport() {
  const names = [...new Set((S?.shopy || []).map(s => s.name))];
  $("#shopNames").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
  $("#impShop").value = LS.get("impShop", "");
  $("#impResults").innerHTML = "";
  $("#import").showModal();
}
async function importFiles(files) {
  const shop = $("#impShop").value.trim();
  if (!shop) { $("#impShop").focus(); $("#impResults").innerHTML = `<li class="msg err">${t("impNeedShop")}</li>`; return; }
  LS.set("impShop", shop);
  for (const f of files) {
    const li = document.createElement("li"); li.textContent = t("impUploading", { f: f.name }); $("#impResults").append(li);
    try {
      const r = await api("/api/import", { shop, soubor: f.name, obsah: await f.text() });
      li.innerHTML = `<span>✓ ${esc(f.name)}</span><span class="num pos">${esc(t("impResult", { kind: tMap("kinds", r.druh) || r.druh, n: r.novych, total: r.radku }))}</span>`;
    } catch (e) { li.innerHTML = `<span class="neg">✗ ${esc(f.name)}: ${esc(e.message)}</span>`; }
  }
  load();
}
$("#impFiles").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); importFiles([...e.dataTransfer.files]); };

applyStatic();
$("#status").textContent = t("loading");
route();
load().then(() => { if (page === "nastaveni") fillSettings(); });
setInterval(load, 60000);
</script>
</body>
</html>
