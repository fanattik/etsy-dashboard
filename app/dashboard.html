<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etsy Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8743b'/><path d='M9 22V10h14M9 16h10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg: #f6f4f0; --panel: #ffffff; --panel-2: #faf8f5; --text: #22201c; --muted: #6f6a62;
  --line: #e7e2da; --accent: #e8743b; --accent-soft: #fdeee5; --good: #2f8f5b; --bad: #c2412d;
  --shop-1: #3d8c86; --shop-2: #e8743b; --shop-3: #7a64c7; --shop-4: #c9a227;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #201f1c; --panel-2: #272521; --text: #f1eee9; --muted: #a39d93;
    --line: #34312c; --accent: #f08a55; --accent-soft: #3a2a20; --good: #5cc28a; --bad: #ef7a64;
    --shop-1: #5fb3ac; --shop-2: #f08a55; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
h1 .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.status { color: var(--muted); font-size: 13px; }
.status .err { color: var(--bad); }
.spacer { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
a.btn { text-decoration: none; display: inline-block; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .55; cursor: default; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip.on { border-color: var(--text); background: var(--text); color: var(--bg); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
select { border: 1px solid var(--line); background: var(--panel); padding: 7px 10px; border-radius: 10px; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; display: none; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner .row { display: flex; align-items: center; gap: 12px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.full { margin-bottom: 14px; }
.halves { grid-template-columns: 1fr 1fr; margin-bottom: 14px; }
@media (max-width: 860px) { .halves { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.kpi .label { color: var(--muted); font-size: 13px; }
.kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 15px; font-weight: 600; }
.kpi .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.kpi.warn .value { color: var(--accent); }
.two { grid-template-columns: 2fr 1fr; margin-bottom: 14px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.card h2 .note { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
svg text { fill: var(--muted); font-size: 11px; }
.bar:hover { opacity: .8; }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 12.5px; display: none; z-index: 9; white-space: nowrap; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.list li:last-child { border-bottom: 0; }
.list .meter { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.list .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tab { border: 0; background: none; padding: 6px 4px; margin-right: 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-color: var(--accent); }
.search { border: 1px solid var(--line); background: var(--panel-2); padding: 7px 12px; border-radius: 10px; min-width: 200px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.nw { white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.new td { background: var(--accent-soft); }
td.items { max-width: 380px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ship { background: var(--accent-soft); border-color: var(--accent); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.more { text-align: center; margin-top: 12px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--text); width: min(620px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg { padding: 20px 22px; }
.dlg h3 { margin: 0 0 4px; }
.dlg section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.dlg label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.dlg input, .dlg textarea, .dlg select { width: 100%; border: 1px solid var(--line); background: var(--panel-2); padding: 8px 10px; border-radius: 10px; }
.dlg .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.dlg .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.shoprow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.msg { font-size: 13.5px; margin-top: 8px; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
.demo { background: var(--text); color: var(--bg); font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.welcome { max-width: 640px; margin: 40px auto; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px 16px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .link { display: inline; color: var(--accent); cursor: pointer; text-decoration: underline; margin: 0; font-size: inherit; }
#impResults li { grid-template-columns: 1fr auto; }
.welcome ol { padding-left: 20px; } .welcome li { margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M9 24V8h14M9 16h10" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/></svg></span>Etsy Dashboard <span id="demoBadge" class="demo" data-i18n="demo" hidden></span></h1>
    <div class="status" id="status"></div>
    <div class="spacer"></div>
    <button class="btn" id="notifBtn" data-i18n="notifBtn" hidden></button>
    <button class="btn" id="importBtn" data-i18n="importBtn"></button>
    <button class="btn" id="checkBtn" data-i18n="checkBtn"></button>
    <button class="btn" id="settingsBtn" data-i18n="settingsBtn"></button>
  </header>

  <div id="welcome" class="card welcome" hidden>
    <h2 data-i18n="welcomeTitle"></h2>
    <p data-i18n="welcomeCsv"></p>
    <button class="btn primary" onclick="openImport()" data-i18n="importBtn"></button>
    <p style="margin-top:22px" data-i18n="welcomeApi"></p>
    <ol>
      <li data-i18n="welcomeStep1"></li>
      <li data-i18n="welcomeStep2"></li>
      <li data-i18n="welcomeStep3"></li>
    </ol>
    <button class="btn" onclick="openSettings()" data-i18n="openSettings"></button>
  </div>

  <div id="main" hidden>
    <div class="filters">
      <div class="chips" id="shopChips"></div>
      <div class="spacer"></div>
      <select id="period" data-i18n-aria="period"></select>
    </div>

    <div class="banner" id="banner">
      <div class="row"><b id="bannerTitle"></b><div class="spacer"></div><button class="btn" id="bannerOk" data-i18n="bannerOk"></button></div>
      <ul id="bannerList"></ul>
    </div>

    <div class="grid kpis" id="kpis"></div>

    <div class="card full">
      <h2><span data-i18n="chartTitle"></span> <span class="note" data-i18n="chartNote"></span></h2>
      <div class="legend" id="legend"></div>
      <div id="chart"></div>
    </div>

    <div class="grid halves">
      <div class="card">
        <h2><span data-i18n="feesTitle"></span> <span class="note" data-i18n="feesNote"></span></h2>
        <ul class="list" id="fees"></ul>
      </div>
      <div class="card">
        <h2><span data-i18n="topTitle"></span> <span class="note" data-i18n="topNote"></span></h2>
        <ul class="list" id="top"></ul>
      </div>
    </div>

      <div class="card full">
        <div class="tabs">
          <button class="tab on" data-tab="orders" data-i18n="tabOrders"></button>
          <button class="tab" data-tab="ledger" data-i18n="tabLedger"></button>
          <div class="spacer"></div>
          <input class="search" id="search" data-i18n-ph="searchPh">
          <a class="btn" id="exportBtn" href="/export/objednavky.csv">⬇ CSV</a>
        </div>
        <div class="tablewrap"><table id="table"></table></div>
        <div class="more"><button class="btn" id="moreBtn" data-i18n="moreBtn" hidden></button></div>
      </div>
  </div>
</div>

<div class="tip" id="tip"></div>

<dialog id="import">
  <div class="dlg">
    <h3 data-i18n="impTitle"></h3>
    <p class="hint" data-i18n="impHint"></p>
    <label for="impShop" data-i18n="impShopLabel"></label>
    <input id="impShop" list="shopNames" data-i18n-ph="impShopPh">
    <datalist id="shopNames"></datalist>
    <label data-i18n="impFilesLabel"></label>
    <div id="drop" class="drop"><span data-i18n="impDrop"></span>
      <input id="impFiles" type="file" accept=".csv,text/csv" multiple hidden></div>
    <ul class="list" id="impResults"></ul>
    <div class="actions"><button class="btn" onclick="$('#import').close()" data-i18n="close"></button></div>
  </div>
</dialog>

<dialog id="settings">
  <div class="dlg">
    <h3 data-i18n="settingsTitle"></h3>
    <label for="lang" data-i18n="langLabel"></label>
    <select id="lang">
      <option value="cs">Čeština</option><option value="en">English</option><option value="de">Deutsch</option>
    </select>
    <label for="currency" data-i18n="curLabel"></label>
    <select id="currency"></select>
    <p class="hint" id="curHint"></p>

    <section>
    <h3 data-i18n="apiTitle"></h3>
    <p class="hint" data-i18n="setHint"></p>
    <label for="keystring">Keystring</label>
    <input id="keystring" autocomplete="off">
    <label for="secret">Shared secret</label>
    <input id="secret" type="password" autocomplete="off" placeholder="">
    <label for="redirect" data-i18n="redirectLabel"></label>
    <input id="redirect">
    <label for="interval" data-i18n="intervalLabel"></label>
    <input id="interval" type="number" min="5" step="5">
    <label for="ntfy" data-i18n="ntfyLabel"></label>
    <input id="ntfy" data-i18n-ph="ntfyPh">
    <div class="actions"><button class="btn primary" id="saveBtn" data-i18n="save"></button></div>
    <div class="msg" id="saveMsg"></div>
    </section>

    <section>
      <h3 data-i18n="shopsTitle"></h3>
      <div id="shopList"></div>
      <p class="hint" data-i18n="shopsHint"></p>
      <div class="actions" style="justify-content:flex-start"><button class="btn" id="authStart" data-i18n="authStart"></button></div>
      <div id="authStep" hidden>
        <p class="hint" data-i18n="authHint"></p>
        <textarea id="authUrl" rows="3" placeholder="https://localhost:3003/etsy?code=…&state=…"></textarea>
        <div class="actions"><button class="btn primary" id="authFinish" data-i18n="authFinish"></button></div>
      </div>
      <div class="msg" id="authMsg"></div>
    </section>
    <section>
      <h3 data-i18n="updTitle"></h3>
      <p class="hint"><span data-i18n="version"></span> <b id="verze"></b>. <span data-i18n="updAuto"></span></p>
      <div class="actions" style="justify-content:flex-start"><button class="btn" id="updBtn" data-i18n="updBtn"></button></div>
      <div class="msg" id="updMsg"></div>
    </section>
    <section>
      <h3 data-i18n="unTitle"></h3>
      <p class="hint" data-i18n="unHint"></p>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="unDelete" style="width:auto"> <span data-i18n="unDelete"></span></label>
      <div class="actions" style="justify-content:flex-start"><button class="btn danger" id="unBtn" data-i18n="unBtn"></button></div>
    </section>
    <div class="actions"><button class="btn" onclick="settings.close()" data-i18n="close"></button></div>
  </div>
</dialog>

<script>

function detectLang() {
  const saved = LS.get("lang", null); if (T[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || ""]) {
    const p = l.slice(0, 2).toLowerCase();
    if (p === "cs" || p === "sk") return "cs"; if (p === "de") return "de"; if (p === "en") return "en";
  }
  return "en";
}
let LANG = detectLang();
function fill(s, p) { return p ? s.replace(/\{(\w+)\}/g, (m, k) => p[k] ?? m) : s; }
function t(k, p) { return fill(T[LANG][k] ?? T.cs[k] ?? k, p); }
function tMap(group, k) { return (T[LANG][group] || {})[k] ?? (T.cs[group] || {})[k]; }
function pl(n, key) {
  const f = T[LANG].plural[key];
  if (f.length === 3) return `${n} ${n === 1 ? f[0] : n >= 2 && n <= 4 ? f[1] : f[2]}`;
  return `${n} ${n === 1 ? f[0] : f[1]}`;
}
function loc() { return T[LANG].locale; }
function monthName(m, y, short) {
  const d = new Date(y ?? 2000, m, 1);
  return short ? d.toLocaleDateString(loc(), { month: "short" }).replace(".", "")
    : d.toLocaleDateString(loc(), y === undefined ? { month: "long" } : { month: "long", year: "numeric" });
}
function applyStatic() {
  document.documentElement.lang = LANG;
  $("#lang").value = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
}
async function syncServerLang() {  // aby i upozornění na telefon chodila ve zvoleném jazyce
  if (!S || S.demo || S.nastaveni.jazyk === LANG) return;
  try { await api("/api/nastaveni", { jazyk: LANG }); S.nastaveni.jazyk = LANG; } catch {}
}

let S = null, D = { objednavky: [], vypis: [] }, RAW = D, RATES = null;
let CUR = LS.get("currency", "");
const COMMON_CUR = ["CZK", "EUR", "USD", "GBP", "PLN", "CHF", "CAD", "AUD", "HUF", "SEK", "DKK", "NOK", "JPY"];
// přepočet všech částek do zvolené měny (kurzy ECB: 1 EUR = x měny)
function convertData() {
  const k = RATES?.kurzy;
  if (!CUR || !k || !k[CUR]) { D = RAW; return; }
  const cv = (v, from) => v === null || v === undefined || !k[from] ? v : v / k[from] * k[CUR];
  const map = (r, keys) => {
    if (r.mena === CUR || !k[r.mena]) return r;
    const o = { ...r, mena: CUR, puv: [r[keys[0]], r.mena] };
    keys.forEach(x => o[x] = cv(r[x], r.mena)); return o;
  };
  D = { ...RAW, objednavky: RAW.objednavky.map(r => map(r, ["celkem"])), vypis: RAW.vypis.map(r => map(r, ["castka", "zustatek"])) };
}
function origTitle(r) { return r.puv ? ` title="${esc(t("curOrig", { v: fmtMoney(r.puv[0], r.puv[1]) }))}"` : ""; }
function buildCurrency() {
  const k = RATES?.kurzy, list = k ? Object.keys(k).sort() : COMMON_CUR;
  const opts = [["", t("curOriginal")]].concat([...new Set(COMMON_CUR.filter(c => list.includes(c)).concat(list))].map(c => [c, c]));
  $("#currency").innerHTML = opts.map(([v, txt]) => `<option value="${v}">${esc(txt)}</option>`).join("");
  $("#currency").value = CUR;
  $("#curHint").textContent = !CUR ? "" : k ? t("curHint", { d: RATES.datum ? new Date(RATES.datum + "T12:00").toLocaleDateString(loc()) : "?" }) : t("curNoRates");
}
let shopFilter = LS.get("shop", "all"), tab = "orders", shown = 25;
let lastSeen = LS.get("lastSeen", 0);

function fmtMoney(v, cur) {
  try { return new Intl.NumberFormat(loc(), { style: "currency", currency: cur || "USD", maximumFractionDigits: 2 }).format(v); }
  catch { return v.toFixed(2) + " " + (cur || ""); }
}
function sumByCur(rows, key) {
  const m = {}; rows.forEach(r => { m[r.mena] = (m[r.mena] || 0) + r[key]; }); return m;
}
function moneyHtml(m) {
  const e = Object.entries(m).filter(([, v]) => Math.abs(v) > 0.004);
  if (!e.length) return fmtMoney(0, (D.objednavky[0] || D.vypis[0] || {}).mena || "USD");
  return e.map(([c, v]) => fmtMoney(v, c)).join("<br><small>") + (e.length > 1 ? "</small>" : "");
}
function fmtDate(ts) {
  const d = new Date(ts * 1000);  // z CSV známe jen den (uložen jako poledne)
  if (d.getHours() === 12 && d.getMinutes() === 0 && d.getSeconds() === 0) return d.toLocaleDateString(loc());
  return d.toLocaleDateString(loc()) + " " + d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" });
}
function ago(ts) {
  if (!ts) return t("never");
  const s = Math.round(Date.now() / 1000 - ts);
  if (s < 60) return t("justNow"); if (s < 3600) return t("minAgo", { n: Math.round(s / 60) });
  return fmtDate(ts);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function shopColor(name) {
  const i = (S?.shopy || []).findIndex(s => s.name === name);
  return `var(--shop-${(i < 0 ? 0 : i) % 4 + 1})`;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { const tr = j.kod && tMap("errors", j.kod); throw new Error(tr ? fill(tr, j.param || {}) : j.chyba || t("error")); }
  return j;
}

  const sel = $("#period"), opts = [
    ["this", t("pThis")], ["last", t("pLast")], ["30", t("p30")], ["year", t("pYear")], ["all", t("pAll")]];
  const months = new Set(D.objednavky.concat(D.vypis).map(r => { const d = new Date((r.vytvoreno_ts || r.datum_ts) * 1000); return d.getFullYear() * 100 + d.getMonth(); }));
  [...months].sort((a, b) => b - a).forEach(m => opts.push([`m${m}`, monthName(m % 100, Math.floor(m / 100))]));
  const cur = LS.get("period", "this");
  sel.innerHTML = opts.map(([v, txt]) => `<option value="${v}">${esc(txt)}</option>`).join("");
  sel.value = opts.some(o => o[0] === cur) ? cur : "this";
}
function periodRange() {
  const v = $("#period").value, now = new Date();
  const start = (y, m) => new Date(y, m, 1).getTime() / 1000;
  if (v === "this") return [start(now.getFullYear(), now.getMonth()), Infinity];
  if (v === "last") return [start(now.getFullYear(), now.getMonth() - 1), start(now.getFullYear(), now.getMonth())];
  if (v === "30") return [Date.now() / 1000 - 30 * 86400, Infinity];
  if (v === "year") return [start(now.getFullYear(), 0), Infinity];
  if (v.startsWith("m")) { const m = +v.slice(1); return [start(Math.floor(m / 100), m % 100), start(Math.floor(m / 100), m % 100 + 1)]; }
  return [0, Infinity];
}
function periodLen(a, b) { return (Math.min(b, Date.now() / 1000) - a); }

// ---------- render
function filtered() {
  const byShop = r => shopFilter === "all" || r.shop === shopFilter;
  const [a, b] = periodRange();
  const inP = ts => ts >= a && ts < b;
  return {
    orders: D.objednavky.filter(byShop),
    ledger: D.vypis.filter(byShop),
    pOrders: D.objednavky.filter(r => byShop(r) && inP(r.vytvoreno_ts)),
    pLedger: D.vypis.filter(r => byShop(r) && inP(r.datum_ts)),
    range: [a, b],
  };
}

function renderChips() {
  const shops = S.shopy.map(s => s.name);
  if (shopFilter !== "all" && !shops.includes(shopFilter)) shopFilter = "all";
  $("#shopChips").innerHTML = [["all", t("allShops")]].concat(shops.map(s => [s, s])).map(([v, txt]) =>
    `<button class="chip ${v === shopFilter ? "on" : ""}" data-shop="${esc(v)}">${v === "all" ? "" : `<span class="dot" style="background:${shopColor(v)}"></span>`}${esc(txt)}</button>`).join("");
}

function renderKpis(f) {
  const [a, b] = f.range;
  const revenue = sumByCur(f.pOrders, "celkem");
  const n = f.pOrders.length;
  // stejné období o krok dříve pro srovnání počtu objednávek
  const len = periodLen(a, b), prevN = isFinite(len) && a > 0
    ? f.orders.filter(r => r.vytvoreno_ts >= a - len && r.vytvoreno_ts < a).length : null;
  const fees = f.pLedger.filter(r => r.castka < 0 && !PAYOUT.test(r.typ) && !REFUND.test(r.typ + r.popis));
  const net = f.pLedger.filter(r => !PAYOUT.test(r.typ));
  const payouts = f.pLedger.filter(r => PAYOUT.test(r.typ));
  const toShip = f.orders.filter(r => r.zaplaceno && r.odeslano === 0);
  const balances = {};
  S.shopy.forEach(s => { if (shopFilter !== "all" && s.name !== shopFilter) return;
    const last = D.vypis.find(r => r.shop === s.name && r.zustatek !== null); if (last) balances[last.mena] = (balances[last.mena] || 0) + last.zustatek; });
  const hasBalance = Object.keys(balances).length > 0;
  const avg = {}; Object.entries(revenue).forEach(([c, v]) => avg[c] = v / (f.pOrders.filter(r => r.mena === c).length || 1));
  let diff = "";
  if (prevN !== null && prevN > 0) { const p = Math.round((n - prevN) / prevN * 100); diff = t("vsPrev", { sign: p >= 0 ? "▲" : "▼", p: Math.abs(p) }); }
  else if (prevN === 0 && n) diff = t("noneBefore");
  const feePct = (() => { const r = Object.values(revenue).reduce((x, y) => x + y, 0), fe = -fees.reduce((x, y) => x + y.castka, 0); return r ? t("feePct", { p: Math.round(fe / r * 100) }) : ""; })();
  const cards = [
    [t("kRevenue"), moneyHtml(revenue), pl(n, "order")],
    [t("kOrders"), n, diff],
    [t("kAvg"), moneyHtml(avg), ""],
    [t("kFees"), moneyHtml(sumByCur(fees, "castka")), feePct],
    [t("kNet"), moneyHtml(sumByCur(net, "castka")), t("netSub")],
    [t("kPayouts"), moneyHtml(Object.fromEntries(Object.entries(sumByCur(payouts, "castka")).map(([c, v]) => [c, -v]))), t("payoutsN", { n: payouts.length })],
    [t("kBalance"), hasBalance ? moneyHtml(balances) : "–", hasBalance ? t("balSub") : t("balNone")],
    f.orders.some(r => r.odeslano !== null)
      ? [t("kToShip"), toShip.length, toShip.length ? t("shipPending") : t("allShipped"), toShip.length ? "warn" : ""]
      : [t("kToShip"), "–", t("shipUnknown")],
  ];
  $("#kpis").innerHTML = cards.map(([l, v, s, cls]) =>
    `<div class="card kpi ${cls || ""}"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s || "&nbsp;"}</div></div>`).join("");
}

function renderChart(f) {
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push([d.getFullYear(), d.getMonth()]); }
  const shops = S.shopy.map(s => s.name).filter(s => shopFilter === "all" || s === shopFilter);
  const cur = (f.orders[0] || {}).mena || "USD";
  const vals = months.map(([y, m]) => shops.map(s => f.orders.filter(r => {
    const d = new Date(r.vytvoreno_ts * 1000); return r.shop === s && r.mena === cur && d.getFullYear() === y && d.getMonth() === m;
  }).reduce((a, r) => a + r.celkem, 0)));
  const max = Math.max(1, ...vals.map(v => v.reduce((a, b) => a + b, 0)));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const W = 1100, H = 260, L = 48, B = 26, T0 = 8, bw = (W - L) / 12;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("chartTitle"))}">`;
  for (let g = 0; g <= top; g += step) {
    const y = H - B - (g / top) * (H - B - T0);
    svg += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(g).toLocaleString(loc())}</text>`;
  }
  vals.forEach((v, i) => {
    let y = H - B;
    v.forEach((val, si) => {
      const h = (val / top) * (H - B - T0); if (h <= 0) return; y -= h;
      svg += `<rect class="bar" x="${L + i * bw + bw * .18}" y="${y}" width="${bw * .64}" height="${h}" rx="3" fill="${shopColor(shops[si])}" data-tip="${esc(shops[si])}: ${esc(fmtMoney(val, cur))} (${esc(monthName(months[i][1], months[i][0]))})"/>`;
    });
    svg += `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(monthName(months[i][1], undefined, true))}</text>`;
  });
  $("#chart").innerHTML = svg + "</svg>";
  $("#legend").innerHTML = shops.map(s => `<span><span class="dot" style="background:${shopColor(s)}"></span> ${esc(s)}</span>`).join("") + `<span>${esc(t("inCur", { cur }))}</span>`;
}
function niceStep(max) { const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw); }

function renderTop(f) {
  const m = {};
  f.pOrders.forEach(r => r.polozky.split("; ").forEach(it => {
    const mt = it.match(/^(\d+)x (.*)$/); const q = mt ? +mt[1] : 1, name = mt ? mt[2] : it;
    if (!name) return; m[name] = m[name] || { q: 0, shop: r.shop }; m[name].q += q;
  }));
  const top = Object.entries(m).sort((a, b) => b[1].q - a[1].q).slice(0, 8);
  const max = top.length ? top[0][1].q : 1;
  $("#top").innerHTML = top.length ? top.map(([name, v]) =>
    `<li><span>${esc(name)}</span><span class="num">${v.q}×</span><span class="meter"><i style="width:${v.q / max * 100}%;background:${shopColor(v.shop)}"></i></span></li>`).join("")
    : `<li class="empty">${t("nothing")}</li>`;
}

function renderFees(f) {
  const g = {};
  f.pLedger.forEach(r => {
    const key = PAYOUT.test(r.typ) ? t("payoutGroup") : (tMap("types", r.typ) || tMap("types", r.typ.toLowerCase()) || r.typ || t("other"));
    g[key] = g[key] || {}; g[key][r.mena] = (g[key][r.mena] || 0) + r.castka;
  });
  const rows = Object.entries(g).map(([k, m]) => [k, m, Object.values(m).reduce((a, b) => a + b, 0)]).sort((a, b) => b[2] - a[2]);
  const max = Math.max(1, ...rows.map(r => Math.abs(r[2])));
  $("#fees").innerHTML = rows.length ? rows.map(([k, m, sum]) =>
    `<li><span>${esc(k)}</span><span class="num ${sum < 0 ? "neg" : "pos"}">${moneyHtml(m)}</span><span class="meter"><i style="width:${Math.abs(sum) / max * 100}%;background:${sum < 0 ? "var(--bad)" : "var(--good)"}"></i></span></li>`).join("")
    : `<li class="empty">${t("noMoves")}</li>`;
}

function renderTable(f) {
  const q = $("#search").value.trim().toLowerCase();
  const match = r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q));
  const rows = (tab === "orders" ? f.pOrders : f.pLedger).filter(match);
  const multi = S.shopy.length > 1 && shopFilter === "all";
  const shopTh = multi ? `<th>${t("colShop")}</th>` : "";
  const shopTd = r => multi ? `<td class="nw"><span class="dot" style="background:${shopColor(r.shop)}"></span> ${esc(r.shop)}</td>` : "";
  let html;
  if (tab === "orders") {
    html = `<thead><tr><th>${t("colDate")}</th>${shopTh}<th>${t("colBuyer")}</th><th>${t("colItems")}</th><th class="num">${t("colTotal")}</th><th>${t("colStatus")}</th></tr></thead><tbody>` +
      rows.slice(0, shown).map(r => `<tr class="${r.pridano_ts > lastSeen ? "new" : ""}"><td class="nw">${fmtDate(r.vytvoreno_ts)}</td>${shopTd(r)}<td>${esc(r.zakaznik)}</td><td class="items">${esc(r.polozky)}</td><td class="num"${origTitle(r)}>${fmtMoney(r.celkem, r.mena)}</td><td>${r.zaplaceno && r.odeslano === 0 ? `<span class="pill ship">${t("kToShip")}</span>` : `<span class="pill">${esc(tMap("statuses", r.stav) || r.stav)}</span>`}</td></tr>`).join("");
  } else {
    html = `<thead><tr><th>${t("colDate")}</th>${shopTh}<th>${t("colDesc")}</th><th>${t("colType")}</th><th class="num">${t("colAmount")}</th><th class="num">${t("colBalance")}</th></tr></thead><tbody>` +
      rows.slice(0, shown).map(r => `<tr class="${r.pridano_ts > lastSeen ? "new" : ""}"><td class="nw">${fmtDate(r.datum_ts)}</td>${shopTd(r)}<td>${esc(r.popis)}</td><td><span class="pill">${esc(r.typ)}</span></td><td class="num ${r.castka < 0 ? "neg" : "pos"}"${origTitle(r)}>${fmtMoney(r.castka, r.mena)}</td><td class="num">${r.zustatek === null ? "–" : fmtMoney(r.zustatek, r.mena)}</td></tr>`).join("");
  }
  $("#table").innerHTML = rows.length ? html + "</tbody>" : `<tbody><tr><td class="empty">${t("nothing")}</td></tr></tbody>`;
  $("#moreBtn").hidden = rows.length <= shown;
  $("#exportBtn").href = (tab === "orders" ? "/export/objednavky.csv" : "/export/vypis.csv") + "?lang=" + LANG;
}

function renderBanner() {
  const nO = D.objednavky.filter(r => r.pridano_ts > lastSeen), nL = D.vypis.filter(r => r.pridano_ts > lastSeen);
  if (!nO.length && !nL.length) { $("#banner").style.display = "none"; return; }
  $("#banner").style.display = "block";
  $("#bannerTitle").textContent = t("bannerTitle", { o: pl(nO.length, "order"), l: pl(nL.length, "move") });
  $("#bannerList").innerHTML = nO.slice(0, 5).map(r => `<li>🛒 <b>${esc(r.shop)}</b>: ${esc(t("bannerItem", { total: fmtMoney(r.celkem, r.mena), buyer: r.zakaznik }))} (${esc(r.polozky)})</li>`).join("") +
    (nO.length > 5 ? `<li>${esc(t("andMore", { n: nO.length - 5 }))}</li>` : "");
}

function renderStatus() {
  const errs = Object.entries(S.chyby || {});
  $("#checkBtn").hidden = !S.nastaveno;
  $("#status").innerHTML = esc(S.bezi ? t("checking") : S.nastaveno ? t("lastCheck", { t: ago(S.posledni_kontrola) }) : t("csvOnly")) +
    errs.map(([s, e]) => `<br><span class="err">⚠ ${esc(s)}: ${esc(e)}</span>`).join("");
  $("#demoBadge").hidden = !S.demo;
}

function render() {
  renderStatus();
  const ready = S.shopy.length > 0;
  $("#welcome").hidden = !!ready; $("#main").hidden = !ready;
  if (!ready) return;
  renderChips();
  const f = filtered();
  renderBanner(); renderKpis(f); renderChart(f); renderTop(f); renderFees(f); renderTable(f);
}

// ---------- načítání a upozornění
let notified = LS.get("notified", 0);
async function load() {
  try {
    S = await api("/api/stav");
    RAW = await api("/api/data");
    if (!RATES || Date.now() / 1000 - (RATES.stazeno || 0) > 12 * 3600) RATES = await api("/api/kurzy").catch(() => RATES);
    convertData();
    const prev = $("#period").value; buildPeriods(); if (prev) $("#period").value = prev;
    render();
    notifyNew();
    syncServerLang();
  } catch (e) { $("#status").innerHTML = `<span class="err">${esc(t("notRunning"))} ${esc(e.message)}</span>`; }
}
function notifyNew() {
  const newest = Math.max(0, ...D.objednavky.map(r => r.pridano_ts), ...D.vypis.map(r => r.pridano_ts));
  if (!notified) { notified = newest; LS.set("notified", newest); return; }
  if (newest <= notified) return;
  const nO = D.objednavky.filter(r => r.pridano_ts > notified);
  notified = newest; LS.set("notified", newest);
  if (!nO.length || !("Notification" in window) || Notification.permission !== "granted") return;
  new Notification(nO.length === 1 ? t("newOrder") : t("newOrders", { n: nO.length }),
    { body: nO.slice(0, 3).map(r => `${r.shop}: ${fmtMoney(r.celkem, r.mena)} (${r.polozky})`).join("\n") });
}
function setupNotifBtn() {
  const b = $("#notifBtn");
  if (!("Notification" in window) || Notification.permission !== "default") return;
  b.hidden = false;
  b.onclick = async () => { await Notification.requestPermission(); b.hidden = true; };
}

// ---------- nastavení
const settings = $("#settings");
function openSettings() {
  const n = S.nastaveni;
  $("#keystring").value = n.keystring || ""; $("#secret").value = "";
  $("#secret").placeholder = n.ma_secret ? t("secretSaved") : "";
  $("#redirect").value = n.redirect_uri || ""; $("#interval").value = n.interval_minut || 15; $("#ntfy").value = n.ntfy_topic || "";
  $("#verze").textContent = S.verze || "";
  $("#updMsg").textContent = "";
  $("#saveMsg").textContent = ""; $("#authMsg").textContent = ""; $("#authStep").hidden = true;
  renderShopList(); buildCurrency();
  if (!settings.open) settings.showModal();
}
function renderShopList() {
  $("#shopList").innerHTML = S.shopy.length ? S.shopy.map(s =>
    `<div class="shoprow"><span class="dot" style="background:${shopColor(s.name)}"></span><b>${esc(s.name)}</b><div class="spacer"></div><button class="btn" data-remove="${esc(s.id)}">${t("remove")}</button></div>`).join("")
    : `<p class="hint">${t("noShops")}</p>`;
}
function msg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
$("#saveBtn").onclick = async () => {
  try {
    await api("/api/nastaveni", { keystring: $("#keystring").value, shared_secret: $("#secret").value,
      redirect_uri: $("#redirect").value, interval_minut: +$("#interval").value, ntfy_topic: $("#ntfy").value, jazyk: LANG });
    msg($("#saveMsg"), t("saved"), true); S = await api("/api/stav"); render();
  } catch (e) { msg($("#saveMsg"), e.message); }
};
$("#authStart").onclick = async () => {
  try { const { url } = await api("/api/prihlasit/start", {}); window.open(url, "_blank"); $("#authStep").hidden = false; $("#authUrl").value = ""; $("#authMsg").textContent = ""; }
  catch (e) { msg($("#authMsg"), e.message); }
};
$("#authFinish").onclick = async () => {
  try { const r = await api("/api/prihlasit/dokoncit", { url: $("#authUrl").value });
    msg($("#authMsg"), t("shopConnected", { shop: r.shop }), true);
    $("#authStep").hidden = true; setTimeout(load, 3000); S = await api("/api/stav"); }
  catch (e) { msg($("#authMsg"), e.message); }
};
$("#updBtn").onclick = async () => {
  const b = $("#updBtn"); b.disabled = true; msg($("#updMsg"), t("updSearching"), true);
  try {
    const r = await api("/api/aktualizace", {});
    if (!r.nova) msg($("#updMsg"), t("updLatest", { v: r.verze }), true);
    else { msg($("#updMsg"), t("updInstalling", { v: r.verze }), true); setTimeout(() => location.reload(), 5000); }
  } catch (e) { msg($("#updMsg"), t("updFailed") + e.message); }
  b.disabled = false;
};
$("#unBtn").onclick = async () => {
  const del = $("#unDelete").checked;
  if (!confirm(del ? t("unConfirmDel") : t("unConfirm"))) return;
  try { await api("/api/odinstalovat", { smazat_data: del }); } catch (e) { alert(e.message); return; }
  settings.close();
  document.body.innerHTML = `<div class="wrap"><div class="card welcome"><h2>${t("unDoneTitle")}</h2>
    <p>${t("unDoneText")} ${del ? t("unDataDeleted") : t("unDataKept")}</p>
    <p>${t("unDoneText2")}</p></div></div>`;
};
$("#shopList").onclick = async e => {
  const id = e.target.dataset.remove; if (!id || !confirm(t("removeConfirm"))) return;
  try { await api("/api/odebrat", { id }); S = await api("/api/stav"); openSettings(); render(); } catch (err) { alert(err.message); }
};

// ---------- ovládání
$("#settingsBtn").onclick = openSettings;
$("#checkBtn").onclick = async () => {
  const b = $("#checkBtn"); b.disabled = true; b.textContent = t("checking");
  try { await api("/api/zkontrolovat", {}); } catch (e) { alert(e.message); }
  b.disabled = false; b.textContent = t("checkBtn"); load();
};
$("#lang").onchange = () => {
  LANG = $("#lang").value; LS.set("lang", LANG); applyStatic();
  if (!S) return;
  const prev = $("#period").value; buildPeriods(); $("#period").value = prev;
  render(); syncServerLang();
  if (settings.open) { $("#secret").placeholder = S.nastaveni.ma_secret ? t("secretSaved") : ""; renderShopList(); buildCurrency(); }
};
$("#currency").onchange = async () => {
  CUR = $("#currency").value; LS.set("currency", CUR);
  if (CUR && !RATES?.kurzy) RATES = await api("/api/kurzy").catch(() => null);
  buildCurrency(); convertData();
  if (!S) return;
  const prev = $("#period").value; buildPeriods(); $("#period").value = prev; render();
};
$("#shopChips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; shopFilter = c.dataset.shop; LS.set("shop", shopFilter); shown = 25; render(); };
$("#period").onchange = () => { LS.set("period", $("#period").value); shown = 25; render(); };
$("#search").oninput = () => { shown = 25; renderTable(filtered()); };
$("#moreBtn").onclick = () => { shown += 50; renderTable(filtered()); };
document.querySelectorAll(".tab").forEach(el => el.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === el)); tab = el.dataset.tab; shown = 25; renderTable(filtered());
});
$("#bannerOk").onclick = () => { lastSeen = Math.floor(Date.now() / 1000); LS.set("lastSeen", lastSeen); render(); };
const tip = $("#tip");
$("#chart").onmousemove = e => { const txt = e.target.dataset?.tip; if (!txt) { tip.style.display = "none"; return; }
  tip.textContent = txt; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 12 + "px"; };
$("#chart").onmouseleave = () => tip.style.display = "none";

// ---------- import CSV
function openImport() {
  const names = [...new Set(S.shopy.map(s => s.name))];
  $("#shopNames").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
  $("#impShop").value = LS.get("impShop", "");
  $("#impResults").innerHTML = "";
  $("#import").showModal();
}
async function importFiles(files) {
  const shop = $("#impShop").value.trim();
  if (!shop) { $("#impShop").focus(); $("#impResults").innerHTML = `<li class="msg err">${t("impNeedShop")}</li>`; return; }
  LS.set("impShop", shop);
  for (const f of files) {
    const li = document.createElement("li"); li.textContent = t("impUploading", { f: f.name }); $("#impResults").append(li);
    try {
      const r = await api("/api/import", { shop, soubor: f.name, obsah: await f.text() });
      li.innerHTML = `<span>✓ ${esc(f.name)}</span><span class="num pos">${esc(t("impResult", { kind: tMap("kinds", r.druh) || r.druh, n: r.novych, total: r.radku }))}</span>`;
    } catch (e) { li.innerHTML = `<span class="neg">✗ ${esc(f.name)}: ${esc(e.message)}</span>`; }
  }
  load();
}
$("#importBtn").onclick = openImport;
$("#impFiles").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); importFiles([...e.dataTransfer.files]); };

applyStatic();
$("#status").textContent = t("loading");
setupNotifBtn();
load();
setInterval(load, 60000);
</script>
